<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1560" viewBox="0 0 2400 1560" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用基础平台全局链路</title>
  <desc id="desc">展示渠道、平台控制面、Agent Runtime、连接器与知识、模型网关、治理与可观测六个区域，以及唯一 AI SDK GatewayClient 到 LiteLLM 的模型调用路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087E6B"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8699"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#101828" flood-opacity="0.09"/>
    </filter>
    <style>
      .canvas { fill: #F6F8FB; }
      .title { font: 500 42px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17202A; }
      .subtitle { font: 400 20px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .region { stroke-width: 2; rx: 8; }
      .region-channel { fill: #EAF3FF; stroke: #9CC4F2; }
      .region-control { fill: #F3EEFC; stroke: #BEA8E2; }
      .region-runtime { fill: #EAF7F1; stroke: #91CDB5; }
      .region-gateway { fill: #FFF4E5; stroke: #E5B66F; }
      .region-connector { fill: #FBEFEF; stroke: #DBAAAA; }
      .region-governance { fill: #EEF1F5; stroke: #B8C0CC; }
      .region-title { font: 500 24px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #25313D; }
      .region-note { font: 400 15px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .node { fill: #FFFFFF; stroke: #C7D0DB; stroke-width: 2; rx: 8; filter: url(#shadow); }
      .node-accent { fill: #DDF6EF; stroke: #54B69E; stroke-width: 3; rx: 8; filter: url(#shadow); }
      .node-gateway { fill: #FFE7BE; stroke: #D99A3E; stroke-width: 3; rx: 8; filter: url(#shadow); }
      .node-future { fill: #FFFFFF; stroke: #A8B0BC; stroke-width: 2; stroke-dasharray: 9 7; rx: 8; }
      .node-title { font: 500 20px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1D2939; text-anchor: middle; }
      .node-subtitle { font: 400 15px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #667085; text-anchor: middle; }
      .node-code { font: 400 14px "SFMono-Regular", Consolas, monospace; fill: #475467; text-anchor: middle; }
      .edge { fill: none; stroke: #344054; stroke-width: 3; marker-end: url(#arrow); }
      .edge-accent { fill: none; stroke: #087E6B; stroke-width: 5; marker-end: url(#arrow-accent); }
      .edge-management { fill: none; stroke: #5B6675; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-future { fill: none; stroke: #7A8699; stroke-width: 2.5; stroke-dasharray: 10 8; marker-end: url(#arrow-muted); }
      .edge-observe { fill: none; stroke: #8A94A3; stroke-width: 2; stroke-dasharray: 5 8; marker-end: url(#arrow-muted); }
      .edge-label-bg { fill: #F6F8FB; opacity: 0.96; rx: 5; }
      .edge-label { font: 500 15px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #344054; text-anchor: middle; }
      .edge-label-accent { font: 500 16px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #087E6B; text-anchor: middle; }
      .legend { font: 400 16px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475467; }
    </style>
  </defs>

  <rect class="canvas" width="2400" height="1560"/>
  <text class="title" x="60" y="62">AI 应用基础平台 · 全局链路</text>
  <text class="subtitle" x="60" y="98">唯一 AI SDK GatewayClient · LiteLLM 严格模型网关边界 · V0.6 当前切片</text>

  <!-- 六个架构区域 -->
  <rect class="region region-control" x="500" y="125" width="1830" height="170"/>
  <text class="region-title" x="530" y="164">2. 平台控制面</text>
  <text class="region-note" x="530" y="190">逐步建设：发布版本化定义与策略，不参与单次 Run 执行</text>

  <rect class="region region-channel" x="60" y="340" width="390" height="780"/>
  <text class="region-title" x="90" y="382">1. 渠道与体验层</text>

  <rect class="region region-runtime" x="500" y="340" width="1080" height="780"/>
  <text class="region-title" x="530" y="382">3. Agent Runtime</text>
  <text class="region-note" x="530" y="407">拥有会话、Run、上下文、记忆和模型客户端边界</text>

  <rect class="region region-gateway" x="1630" y="340" width="500" height="430"/>
  <text class="region-title" x="1660" y="382">5. 模型网关</text>
  <text class="region-note" x="1660" y="407">严格边界：访问、路由、密钥与调用治理</text>

  <rect class="region region-connector" x="1630" y="820" width="700" height="300"/>
  <text class="region-title" x="1660" y="862">4. 连接器与知识层</text>
  <text class="region-note" x="1660" y="887">当前仅 Tool Registry 预留，真实执行链未来启用</text>

  <rect class="region region-governance" x="60" y="1170" width="2270" height="300"/>
  <text class="region-title" x="90" y="1212">6. 治理与可观测</text>
  <text class="region-note" x="90" y="1238">统一身份上下文与事件结构横切所有区域，不进入同步主链</text>

  <!-- 平台控制面节点 -->
  <rect class="node-future" x="650" y="205" width="400" height="66"/>
  <text class="node-title" x="850" y="246">Agent 定义与版本</text>
  <rect class="node-future" x="1190" y="205" width="400" height="66"/>
  <text class="node-title" x="1390" y="246">工具与权限策略</text>
  <rect class="node-future" x="1730" y="205" width="400" height="66"/>
  <text class="node-title" x="1930" y="246">模型策略与发布</text>

  <!-- 渠道节点 -->
  <rect class="node" x="100" y="420" width="310" height="82"/>
  <text class="node-title" x="255" y="455">用户 / 业务系统</text>
  <text class="node-subtitle" x="255" y="481">交互请求与业务触发</text>

  <rect class="node" x="100" y="545" width="310" height="96"/>
  <text class="node-title" x="255" y="581">Demo / Web / IM / IDE</text>
  <text class="node-subtitle" x="255" y="609">渠道体验与展示适配</text>

  <rect class="node" x="100" y="690" width="310" height="106"/>
  <text class="node-title" x="255" y="728">渠道 HTTP Adapter</text>
  <text class="node-code" x="255" y="756">Run API · JSON · SSE</text>
  <text class="node-subtitle" x="255" y="781">不保存会话事实源</text>

  <rect class="node" x="100" y="935" width="310" height="100"/>
  <text class="node-title" x="255" y="973">纯模型客户端 / 脚本</text>
  <text class="node-code" x="255" y="1002">base_url = /v1</text>

  <!-- Runtime 节点 -->
  <rect class="node" x="550" y="445" width="260" height="108"/>
  <text class="node-title" x="680" y="483">Conversation</text>
  <text class="node-title" x="680" y="509">Coordinator</text>
  <text class="node-subtitle" x="680" y="535">同会话串行 Run</text>

  <rect class="node" x="890" y="435" width="350" height="128"/>
  <text class="node-title" x="1065" y="473">Session / Run 应用服务</text>
  <text class="node-subtitle" x="1065" y="503">幂等 · 生命周期 · 结果组装</text>
  <text class="node-subtitle" x="1065" y="531">先落消息，再规划并调用模型</text>

  <rect class="node" x="550" y="825" width="300" height="138"/>
  <text class="node-title" x="700" y="865">SQLite Conversation Store</text>
  <text class="node-subtitle" x="700" y="895">会话 · 消息 · Run · Memory</text>
  <text class="node-subtitle" x="700" y="923">版本 · 事件日志 · 事实源</text>

  <rect class="node" x="890" y="650" width="300" height="124"/>
  <text class="node-title" x="1040" y="690">Context Planner</text>
  <text class="node-subtitle" x="1040" y="720">记忆 · Episode · 最近消息</text>
  <text class="node-subtitle" x="1040" y="748">token 预算与 Context Manifest</text>

  <rect class="node" x="890" y="840" width="300" height="124"/>
  <text class="node-title" x="1040" y="880">Memory Manager</text>
  <text class="node-subtitle" x="1040" y="910">提取 · 压缩 · MemoryDelta</text>
  <text class="node-subtitle" x="1040" y="938">memoryVersion 乐观锁</text>

  <rect class="node-accent" x="1270" y="610" width="260" height="132"/>
  <text class="node-title" x="1400" y="649">GatewayClient</text>
  <text class="node-title" x="1400" y="677">Port / Facade</text>
  <text class="node-subtitle" x="1400" y="707">Runtime 唯一模型客户端</text>

  <rect class="node-accent" x="1270" y="800" width="260" height="136"/>
  <text class="node-title" x="1400" y="839">AI SDK Core</text>
  <text class="node-code" x="1400" y="868">generateText</text>
  <text class="node-code" x="1400" y="894">@ai-sdk/openai-compatible</text>
  <text class="node-subtitle" x="1400" y="920">唯一模型生成路径</text>

  <rect class="node" x="1270" y="978" width="260" height="106"/>
  <text class="node-title" x="1400" y="1015">LiteLLM Management</text>
  <text class="node-code" x="1400" y="1043">/v1/models · token_counter</text>
  <text class="node-subtitle" x="1400" y="1069">不生成模型内容</text>

  <!-- 模型网关与上游 -->
  <rect class="node" x="1690" y="430" width="380" height="96"/>
  <text class="node-title" x="1880" y="468">模型网关策略</text>
  <text class="node-subtitle" x="1880" y="496">别名 · Provider Key · 路由 · 限流 · 预算</text>

  <rect class="node-gateway" x="1690" y="585" width="380" height="116"/>
  <text class="node-title" x="1880" y="628">LiteLLM Proxy :4000</text>
  <text class="node-code" x="1880" y="658">OpenAI-compatible /v1</text>
  <text class="node-subtitle" x="1880" y="684">模型访问与调用治理中心</text>

  <rect class="node" x="2160" y="585" width="180" height="116"/>
  <text class="node-title" x="2250" y="627">外部上游</text>
  <text class="node-subtitle" x="2250" y="657">OpenAI-</text>
  <text class="node-subtitle" x="2250" y="680">compatible API</text>

  <!-- 连接器节点 -->
  <rect class="node" x="1670" y="925" width="190" height="108"/>
  <text class="node-title" x="1765" y="964">Tool Registry</text>
  <text class="node-subtitle" x="1765" y="992">注册与意图判断</text>
  <text class="node-subtitle" x="1765" y="1018">当前预留</text>

  <rect class="node-future" x="1900" y="925" width="190" height="108"/>
  <text class="node-title" x="1995" y="964">Tool Executor</text>
  <text class="node-subtitle" x="1995" y="992">MCP / 业务 API</text>
  <text class="node-subtitle" x="1995" y="1018">未来启用</text>

  <rect class="node-future" x="2130" y="925" width="170" height="108"/>
  <text class="node-title" x="2215" y="964">知识能力</text>
  <text class="node-subtitle" x="2215" y="992">搜索 / RAG</text>
  <text class="node-subtitle" x="2215" y="1018">文档与权限</text>

  <!-- 治理节点 -->
  <rect class="node" x="300" y="1270" width="460" height="116"/>
  <text class="node-title" x="530" y="1314">统一身份上下文</text>
  <text class="node-subtitle" x="530" y="1345">tenant · user · app · agent · run</text>
  <text class="node-subtitle" x="530" y="1372">贯穿渠道、Runtime 与模型调用</text>

  <rect class="node" x="970" y="1270" width="460" height="116"/>
  <text class="node-title" x="1200" y="1314">Trace / Usage / Cost</text>
  <text class="node-subtitle" x="1200" y="1345">调用链、token、延迟、模型与成本</text>
  <text class="node-subtitle" x="1200" y="1372">旁路采集，不成为同步单点</text>

  <rect class="node" x="1640" y="1270" width="460" height="116"/>
  <text class="node-title" x="1870" y="1314">Audit / Evaluation / Feedback</text>
  <text class="node-subtitle" x="1870" y="1345">事件审计、回归评测与用户反馈</text>
  <text class="node-subtitle" x="1870" y="1372">统一事件结构沉淀治理证据</text>

  <!-- 主链路 -->
  <path class="edge" d="M255 502 V545"/>
  <path class="edge" d="M255 641 V690"/>
  <path class="edge" d="M410 743 H480 V499 H550"/>
  <rect class="edge-label-bg" x="430" y="470" width="112" height="28"/>
  <text class="edge-label" x="486" y="490">提交 Run</text>

  <path class="edge" d="M810 499 H890"/>
  <path class="edge" d="M1065 563 V650"/>
  <path class="edge" d="M990 563 H870 V855 H850"/>
  <path class="edge" d="M1040 774 V840"/>
  <path class="edge" d="M890 712 H830 V825"/>
  <path class="edge" d="M890 902 H850"/>
  <path class="edge" d="M1240 499 H1400 V610"/>
  <rect class="edge-label-bg" x="1260" y="529" width="170" height="30"/>
  <text class="edge-label" x="1345" y="550">chatCompletions</text>

  <path class="edge-management" d="M1190 712 H1270"/>
  <rect class="edge-label-bg" x="1189" y="679" width="104" height="27"/>
  <text class="edge-label" x="1241" y="698">countTokens</text>

  <path class="edge-accent" d="M1400 742 V800"/>
  <path class="edge-management" d="M1530 690 H1552 V1031 H1530"/>

  <path class="edge-accent" d="M1530 868 H1600 V643 H1690"/>
  <rect class="edge-label-bg" x="1538" y="744" width="132" height="48"/>
  <text class="edge-label-accent" x="1604" y="765">模型生成</text>
  <text class="edge-label" x="1604" y="785">/chat/completions</text>

  <path class="edge-management" d="M1530 1031 H1572 V720 H1690"/>
  <rect class="edge-label-bg" x="1512" y="682" width="145" height="48"/>
  <text class="edge-label" x="1584" y="703">状态 / token</text>
  <text class="edge-label" x="1584" y="723">管理旁路</text>

  <path class="edge" d="M1880 526 V585"/>
  <path class="edge-accent" d="M2070 643 H2160"/>

  <!-- 纯模型客户端直连模型网关 -->
  <path class="edge" d="M410 985 H470 V1110 H1605 V705 H1690"/>
  <rect class="edge-label-bg" x="905" y="1076" width="236" height="30"/>
  <text class="edge-label" x="1023" y="1097">纯模型调用：OpenAI-compatible</text>

  <!-- SSE 事件回传 -->
  <path class="edge" d="M550 925 H475 V778 H410"/>
  <rect class="edge-label-bg" x="414" y="836" width="118" height="30"/>
  <text class="edge-label" x="473" y="857">事件游标 / SSE</text>

  <!-- 工具链与控制面发布 -->
  <path class="edge-future" d="M1240 520 H1612 V900 H1765 V925"/>
  <rect class="edge-label-bg" x="1564" y="864" width="104" height="30"/>
  <text class="edge-label" x="1616" y="885">工具意图</text>
  <path class="edge-future" d="M1860 979 H1900"/>
  <path class="edge-future" d="M2090 979 H2130"/>

  <path class="edge-future" d="M850 271 V320 H1065 V435"/>
  <path class="edge-future" d="M1390 271 V315 H1765 V925"/>
  <path class="edge-future" d="M1930 271 V430"/>

  <!-- 治理与可观测旁路 -->
  <path class="edge-observe" d="M255 796 V1140 H530 V1270"/>
  <path class="edge-observe" d="M1065 563 V1140 H1200 V1270"/>
  <path class="edge-observe" d="M700 963 V1138 H1870 V1270"/>
  <path class="edge-observe" d="M1880 701 V1145 H1300 V1270"/>
  <path class="edge-observe" d="M1995 1033 V1205 H1870 V1270"/>

  <!-- 图例 -->
  <line x1="700" y1="1522" x2="790" y2="1522" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="legend" x="810" y="1528">当前同步主链</text>
  <line x1="1040" y1="1522" x2="1130" y2="1522" stroke="#087E6B" stroke-width="5" marker-end="url(#arrow-accent)"/>
  <text class="legend" x="1150" y="1528">唯一模型生成路径</text>
  <line x1="1450" y1="1522" x2="1540" y2="1522" stroke="#7A8699" stroke-width="2.5" stroke-dasharray="10 8" marker-end="url(#arrow-muted)"/>
  <text class="legend" x="1560" y="1528">规划能力 / 异步治理</text>
</svg>
