<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Mastra 产研工作流中的局部 ReAct 自闭环</title>
  <desc id="desc">固定治理工作流包裹产品团队、开发团队和测试团队的受限推理、行动、观察循环。团队内部由多个具名角色协作；人工审批和预算、权限、业务决策等条件会中断循环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#1769aa"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#15806f"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7452a2"/></marker>
    <style>.title{font:700 30px Arial,'PingFang SC',sans-serif;fill:#1f2933}.subtitle{font:16px Arial,'PingFang SC',sans-serif;fill:#52616b}.section{font:700 19px Arial,'PingFang SC',sans-serif;fill:#1f2933}.label{font:700 16px Arial,'PingFang SC',sans-serif;fill:#1f2933}.text{font:14px Arial,'PingFang SC',sans-serif;fill:#334e5a}.small{font:12px Arial,'PingFang SC',sans-serif;fill:#52616b}.flow{stroke:#1769aa;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.fact{stroke:#15806f;stroke-width:3;fill:none;marker-end:url(#arrow-green)}.guard{stroke:#7452a2;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow-purple)}</style>
  </defs>
  <rect width="1600" height="1040" fill="white"/>
  <text x="60" y="58" class="title">Workflow + Local ReAct / Mastra 产研中的小范围自主闭环</text><text x="60" y="88" class="subtitle">蓝色：受控执行　绿色：事实与结果回填　紫色虚线：门禁、预算与人工升级</text>
  <rect x="50" y="125" width="1500" height="670" rx="8" fill="#f8fbfd" stroke="#315b74" stroke-width="2.5"/><text x="78" y="160" class="section">受治理的产品研发 Workflow / 持久化 Run、审批与恢复事实由 Mastra Store 拥有</text>
  <rect x="85" y="220" width="260" height="112" rx="7" fill="#eef5fa" stroke="#1769aa" stroke-width="2.5"/><text x="107" y="253" class="label">产品团队阶段</text><text x="107" y="280" class="text">需求、澄清、资料与前序产物</text><text x="107" y="305" class="text">→ 产品团队局部 ReAct</text><path d="M345 276 H410" class="flow"/>
  <rect x="410" y="220" width="230" height="112" rx="7" fill="#f6f0fb" stroke="#7452a2" stroke-width="2.5"/><text x="430" y="253" class="label">人工产品确认</text><text x="430" y="280" class="text">冻结产品版本</text><text x="430" y="305" class="small">未确认不进入开发</text><path d="M640 276 H705" class="flow"/>
  <rect x="705" y="220" width="300" height="112" rx="7" fill="#eef5fa" stroke="#1769aa" stroke-width="2.5"/><text x="727" y="253" class="label">项目范围、架构与团队</text><text x="727" y="280" class="text">文件路径、登记检查、任务依赖</text><text x="727" y="305" class="small">→ 人工批准方案、团队与权限</text><path d="M1005 276 H1070" class="flow"/>
  <rect x="1070" y="220" width="270" height="112" rx="7" fill="#f6f0fb" stroke="#7452a2" stroke-width="2.5"/><text x="1092" y="253" class="label">开发授权门</text><text x="1092" y="280" class="text">范围、预算、角色、工具</text><text x="1092" y="305" class="small">批准后才进入自主 loop</text>
  <rect x="125" y="415" width="405" height="290" rx="8" fill="#fff" stroke="#1769aa" stroke-width="2.5"/><text x="150" y="448" class="section">① 产品团队：分析型 ReAct</text><text x="150" y="470" class="small">内部：协调、澄清、闭环、写作等产品角色协作</text><circle cx="224" cy="555" r="62" fill="#eef5fa" stroke="#1769aa" stroke-width="2.5"/><text x="193" y="550" class="label">Reason</text><text x="183" y="572" class="small">分析需求与缺口</text><circle cx="392" cy="555" r="62" fill="#fff7e7" stroke="#b46a00" stroke-width="2.5"/><text x="370" y="550" class="label">Act</text><text x="347" y="572" class="small">读取受控资料 / Skill</text><circle cx="307" cy="645" r="62" fill="#edf8f5" stroke="#15806f" stroke-width="2.5"/><text x="274" y="640" class="label">Observe</text><text x="266" y="662" class="small">来源、澄清、前序稿</text><path d="M281 520 C315 486 349 490 358 510" class="flow"/><path d="M408 606 C393 625 369 639 354 641" class="flow"/><path d="M257 640 C222 625 202 604 204 582" class="flow"/><text x="151" y="690" class="small">输出：产品稿、待决项、验收候选；不自行批准或进入开发。</text>
  <rect x="590" y="385" width="465" height="350" rx="8" fill="#fff" stroke="#1769aa" stroke-width="3"/><text x="615" y="418" class="section">② 开发团队：执行型 ReAct（最大自主空间）</text><circle cx="685" cy="540" r="68" fill="#eef5fa" stroke="#1769aa" stroke-width="2.5"/><text x="650" y="534" class="label">Reason</text><text x="634" y="557" class="small">任务、finding、失败证据</text><circle cx="930" cy="540" r="68" fill="#fff7e7" stroke="#b46a00" stroke-width="2.5"/><text x="907" y="534" class="label">Act</text><text x="878" y="557" class="small">读写批准路径 / 委派</text><circle cx="808" cy="655" r="68" fill="#edf8f5" stroke="#15806f" stroke-width="2.5"/><text x="770" y="649" class="label">Observe</text><text x="754" y="672" class="small">runChecks、评审、源码散列</text><path d="M745 506 C798 465 859 465 878 498" class="flow"/><path d="M943 608 C921 638 886 654 862 656" class="flow"/><path d="M750 655 C707 637 680 607 678 577" class="flow"/><text x="614" y="712" class="small">范围内缺陷：责任任务 + 下游返工；固定检查、独立评审后才能交付。</text>
  <rect x="1115" y="415" width="365" height="290" rx="8" fill="#fff" stroke="#1769aa" stroke-width="2.5"/><text x="1140" y="448" class="section">③ 测试团队：验证型 ReAct</text><text x="1140" y="470" class="small">内部：测试设计、执行、浏览器 QA 等角色协作</text><circle cx="1206" cy="555" r="62" fill="#eef5fa" stroke="#1769aa" stroke-width="2.5"/><text x="1175" y="550" class="label">Reason</text><text x="1160" y="572" class="small">需求、代码与质量风险</text><circle cx="1370" cy="555" r="62" fill="#fff7e7" stroke="#b46a00" stroke-width="2.5"/><text x="1349" y="550" class="label">Act</text><text x="1327" y="572" class="small">批准用例 / 登记检查 / QA</text><circle cx="1288" cy="645" r="62" fill="#edf8f5" stroke="#15806f" stroke-width="2.5"/><text x="1255" y="640" class="label">Observe</text><text x="1242" y="662" class="small">测试结果、截图与 finding</text><path d="M1264 520 C1296 488 1330 490 1339 510" class="flow"/><path d="M1386 606 C1371 625 1348 639 1335 641" class="flow"/><path d="M1238 640 C1205 625 1186 604 1187 582" class="flow"/><text x="1141" y="690" class="small">缺陷回路：回送原开发团队；不能自行放行或覆盖机器失败。</text>
  <path d="M307 705 V760 H805 V728" class="fact"/><text x="410" y="751" class="small">已确认产品版本、冻结资料与任务事实</text><path d="M1055 558 H1112" class="fact"/><text x="1060" y="540" class="small">候选源码、检查与评审证据</text><path d="M1288 704 V760 H808 V728" class="fact"/><text x="1030" y="751" class="small">finding 回送责任任务，重跑自检与独立评审</text>
  <rect x="50" y="835" width="1500" height="140" rx="8" fill="#fbf8fd" stroke="#7452a2" stroke-width="2.5" stroke-dasharray="9 6"/><text x="78" y="870" class="section">Workflow / 人工治理边界：ReAct 可自主决定“如何完成已授权任务”，不能自主决定“是否扩大或跳过边界”</text><path d="M255 905 H390" class="guard"/><text x="84" y="910" class="label">新业务决定</text><text x="84" y="935" class="small">回到产品澄清</text><path d="M650 905 H785" class="guard"/><text x="475" y="910" class="label">扩大权限 / 完整性问题</text><text x="475" y="935" class="small">暂停并升级人工</text><path d="M1050 905 H1185" class="guard"/><text x="850" y="910" class="label">预算耗尽 / 重复无进展</text><text x="850" y="935" class="small">保存证据、停止 loop</text><text x="1255" y="910" class="label">发布、回滚与外部执行</text><text x="1255" y="935" class="small">仍需批准与外部回执</text>
  <text x="60" y="1015" class="small">主路径：人工确认范围 → 局部 ReAct → 真实检查 / 独立评审 / 独立测试 → 同版本证据交付　　事实源：Mastra Workflow + LibSQLStore</text>
</svg>
