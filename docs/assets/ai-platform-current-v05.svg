<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f8f6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f2fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1b2733" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f6273"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7d8a97"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #17212b; }
      .subtitle { font-size: 21px; font-weight: 400; fill: #5e6b77; }
      .badge { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .regionTitle { font-size: 24px; font-weight: 700; fill: #17212b; }
      .nodeTitle { font-size: 18px; font-weight: 650; fill: #1e2934; }
      .nodeText { font-size: 14px; font-weight: 400; fill: #5c6b78; }
      .small { font-size: 14px; font-weight: 500; fill: #667582; }
      .card { stroke: #d7e0e6; stroke-width: 1.4; filter: url(#shadow); }
      .node { fill: #ffffff; stroke: rgba(52,68,83,.15); stroke-width: 1.2; }
      .line { fill: none; stroke: #4f6273; stroke-width: 3; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #7d8a97; stroke-width: 2.4; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#background)"/>
  <rect x="46" y="40" width="1708" height="1030" rx="32" fill="rgba(255,255,255,.60)" stroke="#dce3e8"/>

  <text x="90" y="106" class="title">AI 应用基础平台当前落地</text>
  <text x="90" y="146" class="subtitle">ai-platform V0.5：集成式 Demo Runtime + 独立 LiteLLM 模型网关</text>
  <rect x="1490" y="74" width="176" height="42" rx="21" fill="#15796d"/>
  <text x="1530" y="102" class="badge">当前阶段 V0.5</text>

  <path d="M352 462 L470 462" class="line"/>
  <path d="M820 462 L938 462" class="softLine"/>
  <path d="M1560 620 L1560 704" class="line"/>

  <rect x="90" y="200" width="1260" height="612" rx="28" fill="#f7fafc" class="card"/>
  <text x="126" y="248" class="regionTitle">当前 Demo Server 进程 :4010</text>
  <text x="126" y="278" class="nodeText">一个进程内保持模块边界，后续按复用需求逐步拆出服务</text>

  <rect x="126" y="324" width="226" height="360" rx="22" fill="#e8f7f2" class="card"/>
  <text x="154" y="370" class="regionTitle">渠道与体验</text>
  <rect x="154" y="408" width="170" height="66" rx="14" class="node"/>
  <text x="176" y="436" class="nodeTitle">浏览器 Demo</text>
  <text x="176" y="458" class="nodeText">demo/index.html</text>
  <rect x="154" y="496" width="170" height="84" rx="14" class="node"/>
  <text x="176" y="526" class="nodeTitle">HTTP Adapter</text>
  <text x="176" y="550" class="nodeText">gateway status</text>
  <text x="176" y="570" class="nodeText">runtime chat / summary</text>
  <text x="154" y="636" class="small">scripts/demo-server.mjs</text>

  <rect x="470" y="324" width="350" height="360" rx="22" fill="#e8f2ff" class="card"/>
  <text x="498" y="370" class="regionTitle">Agent Runtime 雏形</text>
  <rect x="498" y="408" width="294" height="66" rx="14" class="node"/>
  <text x="522" y="436" class="nodeTitle">聊天运行</text>
  <text x="522" y="458" class="nodeText">chat-runtime.mjs</text>
  <rect x="498" y="496" width="294" height="66" rx="14" class="node"/>
  <text x="522" y="524" class="nodeTitle">消息构造</text>
  <text x="522" y="546" class="nodeText">文本 / 图片 / 文档链接</text>
  <rect x="498" y="584" width="294" height="66" rx="14" class="node"/>
  <text x="522" y="612" class="nodeTitle">上下文预算与摘要</text>
  <text x="522" y="634" class="nodeText">summary + history 裁剪</text>

  <rect x="938" y="324" width="350" height="360" rx="22" fill="#fff5df" class="card"/>
  <text x="966" y="370" class="regionTitle">连接器注册预留</text>
  <rect x="966" y="408" width="294" height="74" rx="14" class="node"/>
  <text x="990" y="438" class="nodeTitle">Tool Registry</text>
  <text x="990" y="462" class="nodeText">src/tools/tool-registry.mjs</text>
  <rect x="966" y="510" width="294" height="96" rx="14" fill="#fffaf0" stroke="#d9c79c" stroke-dasharray="7 7"/>
  <text x="990" y="540" class="nodeTitle">当前未启用</text>
  <text x="990" y="566" class="nodeText">真实工具循环 / MCP</text>
  <text x="990" y="588" class="nodeText">业务 API / 知识服务</text>
  <text x="966" y="650" class="small">V1 再跑通第一个工具闭环</text>

  <rect x="1380" y="324" width="330" height="296" rx="22" fill="#f1eaff" class="card"/>
  <text x="1408" y="370" class="regionTitle">模型网关 :4000</text>
  <text x="1408" y="398" class="nodeText">model-gateway</text>
  <rect x="1408" y="428" width="274" height="66" rx="14" class="node"/>
  <text x="1432" y="456" class="nodeTitle">Gateway Client</text>
  <text x="1432" y="478" class="nodeText">src/gateway</text>
  <rect x="1408" y="516" width="274" height="66" rx="14" class="node"/>
  <text x="1432" y="544" class="nodeTitle">LiteLLM Proxy</text>
  <text x="1432" y="566" class="nodeText">config.yaml / chat-default</text>

  <rect x="1380" y="704" width="330" height="108" rx="22" fill="#ffffff" class="card"/>
  <text x="1408" y="748" class="regionTitle">上游模型服务</text>
  <text x="1408" y="780" class="nodeText">OpenAI-compatible API</text>

  <path d="M820 650 C900 760 1270 760 1380 550" class="line"/>

  <rect x="90" y="876" width="1620" height="120" rx="24" fill="#fff0ec" class="card"/>
  <text x="126" y="924" class="regionTitle">当前治理与可观测</text>
  <text x="390" y="924" class="nodeText">OpenSpec / README / docs / smoke test</text>
  <text x="390" y="954" class="nodeText">尚未接入平台控制面、持久化会话、统一 trace、预算限流、审计和评测闭环</text>

  <path d="M900 876 C900 828 645 820 645 684" class="softLine"/>
  <path d="M1250 876 C1250 838 1545 838 1545 812" class="softLine"/>
  <text x="90" y="1040" class="small">读图：当前已经具备可拆模块边界，但仍保持轻量集成部署；`ai-platform` 是总项目，LiteLLM 是内部 `model-gateway`。</text>
</svg>
