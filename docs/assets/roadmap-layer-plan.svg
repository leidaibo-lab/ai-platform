<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7fb"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f1fb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f7b6c"/>
      <stop offset="50%" stop-color="#4a6b8e"/>
      <stop offset="100%" stop-color="#7257a7"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow2" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#506070"/>
    </marker>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #13202c; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526273; }
      .sectionTitle { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .cardTitle { font: 800 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .cardText { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #61707f; }
      .step { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7785; }
      .laneText { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263445; }
      .card { fill: #ffffff; stroke: rgba(39,53,69,.12); stroke-width: 1.4; filter: url(#shadow2); }
      .line { fill: none; stroke: #506070; stroke-width: 3; marker-end: url(#arrow2); }
      .lane { fill: rgba(255,255,255,.68); stroke: rgba(39,53,69,.10); stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#bg2)"/>
  <rect x="46" y="42" width="1708" height="1076" rx="34" fill="rgba(255,255,255,.62)" stroke="rgba(39,53,69,.10)"/>

  <text x="90" y="108" class="title">AI Gateway 架构规划图</text>
  <text x="90" y="146" class="subtitle">从本地模型代理，到工具型智能体，再到多入口平台</text>

  <rect x="90" y="200" width="1620" height="174" rx="28" fill="#ffffff" filter="url(#shadow2)" stroke="rgba(39,53,69,.11)"/>
  <text x="126" y="246" class="sectionTitle">版本路线</text>
  <rect x="186" y="296" width="1390" height="10" rx="5" fill="url(#road)"/>

  <g transform="translate(136,270)">
    <circle cx="50" cy="31" r="36" fill="#0f7b6c"/>
    <text x="28" y="38" class="step">V0</text>
    <text x="0" y="92" class="cardTitle">模型代理</text>
    <text x="-12" y="120" class="cardText">LiteLLM + Demo</text>
  </g>
  <g transform="translate(414,270)">
    <circle cx="50" cy="31" r="40" fill="#1d8f7f"/>
    <text x="20" y="38" class="step">V0.5</text>
    <text x="-4" y="92" class="cardTitle">当前分层</text>
    <text x="-30" y="120" class="cardText">runtime / gateway / API</text>
  </g>
  <g transform="translate(708,270)">
    <circle cx="50" cy="31" r="36" fill="#4a6b8e"/>
    <text x="28" y="38" class="step">V1</text>
    <text x="-14" y="92" class="cardTitle">工具型智能体</text>
    <text x="-18" y="120" class="cardText">工具循环 + 人工确认</text>
  </g>
  <g transform="translate(986,270)">
    <circle cx="50" cy="31" r="36" fill="#5f65a2"/>
    <text x="28" y="38" class="step">V2</text>
    <text x="-10" y="92" class="cardTitle">受控模型网关</text>
    <text x="-26" y="120" class="cardText">virtual key / 预算 / 限流</text>
  </g>
  <g transform="translate(1264,270)">
    <circle cx="50" cy="31" r="36" fill="#7257a7"/>
    <text x="28" y="38" class="step">V3</text>
    <text x="-12" y="92" class="cardTitle">知识增强平台</text>
    <text x="-28" y="120" class="cardText">文档解析 / 检索 / 权限</text>
  </g>
  <g transform="translate(1542,270)">
    <circle cx="50" cy="31" r="36" fill="#8a4fa0"/>
    <text x="28" y="38" class="step">V4</text>
    <text x="-14" y="92" class="cardTitle">多入口平台</text>
    <text x="-30" y="120" class="cardText">统一 runtime / 运营闭环</text>
  </g>

  <text x="90" y="452" class="sectionTitle">五个父级能力如何成熟</text>
  <rect x="90" y="484" width="1620" height="514" rx="28" fill="#ffffff" filter="url(#shadow2)" stroke="rgba(39,53,69,.11)"/>

  <rect x="130" y="534" width="1540" height="62" rx="18" class="lane"/>
  <text x="160" y="574" class="laneText">接入层</text>
  <text x="394" y="574" class="cardText">V0 Demo / 客户端</text>
  <text x="684" y="574" class="cardText">V0.5 分层 API</text>
  <text x="986" y="574" class="cardText">V4 Web / IM / IDE / API 多入口</text>

  <rect x="130" y="626" width="1540" height="62" rx="18" class="lane"/>
  <text x="160" y="666" class="laneText">智能体 / 工作流运行层</text>
  <text x="394" y="666" class="cardText">V0 摘要 + 历史裁剪</text>
  <text x="684" y="666" class="cardText">V0.5 src/runtime</text>
  <text x="986" y="666" class="cardText">V1 工具循环、任务路由、人工确认</text>

  <rect x="130" y="718" width="1540" height="62" rx="18" class="lane"/>
  <text x="160" y="758" class="laneText">工具注册与连接器层</text>
  <text x="394" y="758" class="cardText">V0 无</text>
  <text x="684" y="758" class="cardText">V0.5 tools 预留</text>
  <text x="986" y="758" class="cardText">V1-V3 MCP / 搜索 / 业务 API / 知识库</text>

  <rect x="130" y="810" width="1540" height="62" rx="18" class="lane"/>
  <text x="160" y="850" class="laneText">模型网关层</text>
  <text x="394" y="850" class="cardText">V0 LiteLLM + chat-default</text>
  <text x="684" y="850" class="cardText">V0.5 gateway client</text>
  <text x="986" y="850" class="cardText">V2 多模型路由、fallback、provider key 收口</text>

  <rect x="130" y="902" width="1540" height="62" rx="18" class="lane"/>
  <text x="160" y="942" class="laneText">治理与运营层</text>
  <text x="394" y="942" class="cardText">V0 docs + smoke test</text>
  <text x="684" y="942" class="cardText">V0.5 OpenSpec API 契约</text>
  <text x="986" y="942" class="cardText">V2-V4 身份、预算、审计、评测、成本看板</text>

  <path d="M292 564 C342 564 342 656 392 656" class="line"/>
  <path d="M292 656 C342 656 342 748 392 748" class="line"/>
  <path d="M292 748 C342 748 342 840 392 840" class="line"/>
  <path d="M292 840 C342 840 342 932 392 932" class="line"/>

  <rect x="90" y="1030" width="1620" height="60" rx="20" fill="#17212b"/>
  <text x="126" y="1068" fill="#ffffff" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">实施原则：当前只做 V0.5 到 V1 的必要铺垫；工具、知识库和多人治理按阶段推进，避免所有能力一次性平铺。</text>
</svg>
