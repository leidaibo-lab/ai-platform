<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1560" height="1120" fill="white"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#25324a}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#53657f}.name{font-size:21px;font-weight:600}.body{font-size:17px}.label{font-size:16px;fill:#2563eb}</style><text x="52" y="56" class="title">Mastra v2 · 产品批准到研发交付</text><text x="52" y="91" class="sub">当前受限运行切片 · 原生 Workflow / Agent / LibSQL · fixture 验证控制流，真实业务质量另验</text><rect x="45" y="125" width="1470" height="195" rx="7" fill="#ffffff" stroke="#98aac1" stroke-width="2"/><text x="65" y="159" class="name">product-delivery-v2 / 产品负责</text><rect x="75" y="180" width="400" height="110" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95" y="214" class="name">01 四个固定产品角色</text><text x="95" y="245" class="body">总产品 → 梳理 → 闭环 → 写作</text><text x="95" y="271" class="body">沿用已治理的产品方法</text><rect x="600" y="180" width="350" height="110" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="620" y="214" class="name">02 人工产品批准</text><text x="620" y="245" class="body">批准绑定当前产品 hash</text><text x="620" y="271" class="body">不自动取得代码写权限</text><rect x="1070" y="180" width="415" height="110" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1090" y="214" class="name">03 产品流程结束</text><text x="1090" y="245" class="body">product-approved-for-development</text><text x="1090" y="271" class="body">旧四阶段提案链独立保留</text><path d="M475,235 L600,235" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="495" y="219" class="label">提交当前稿</text><path d="M950,235 L1070,235" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="967" y="219" class="label">保存批准</text><rect x="45" y="385" width="1470" height="490" rx="7" fill="#ffffff" stroke="#98aac1" stroke-width="2"/><text x="65" y="419" class="name">development-execution-v2 / 开发负责</text><rect x="75" y="445" width="420" height="125" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95" y="479" class="name">04 上下文与任务包</text><text x="95" y="510" class="body">实际文件依据 + 批准原文定位</text><text x="95" y="536" class="body">架构 / 任务 / 验收 / 登记检查引用</text><rect x="590" y="445" width="420" height="125" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="610" y="479" class="name">05 就绪与方案批准</text><text x="610" y="510" class="body">结构硬校验 + 独立只读语义评估</text><text x="610" y="536" class="body">关注项逐项裁决 → 人工批准包</text><rect x="1100" y="445" width="385" height="125" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1120" y="479" class="name">06 受限实现</text><text x="1120" y="510" class="body">按依赖串行，精确路径白名单</text><text x="1120" y="536" class="body">前端 / 后端 / 按需基础设施</text><path d="M1290,320 L1290,355" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1290,355 L535,355 L535,430 L285,430 L285,445" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="545" y="347" class="label">显式 CLI 验证原生批准事实 + 项目 manifest</text><path d="M495,505 L590,505" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="512" y="490" class="label">可追溯</text><path d="M1010,505 L1100,505" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1033" y="490" class="label">批准</text><rect x="1100" y="670" width="385" height="135" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1120" y="704" class="name">07 固定开发自检</text><text x="1120" y="735" class="body">真实 Node 检查与不可写 smoke</text><text x="1120" y="761" class="body">产生源码绑定证据；尚未交付</text><rect x="590" y="670" width="420" height="135" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="610" y="704" class="name">08 独立只读代码评审</text><text x="610" y="735" class="body">实际源码 / 变更 / 检查 / 批准意图</text><text x="610" y="761" class="body">缺失、失败、严重未处理问题阻断</text><rect x="75" y="670" width="420" height="135" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95" y="704" class="name">09 确定性交付门</text><text x="95" y="735" class="body">批准 + 完成任务 + 同版检查/评审</text><text x="95" y="761" class="body">通过 → development-delivery.v2</text><path d="M1290,570 L1290,670" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1305" y="625" class="label">完成任务</text><path d="M1100,735 L1010,735" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1018" y="720" class="label">检查通过</text><path d="M590,735 L495,735" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="525" y="720" class="label">报告</text><path d="M800,805 L800,842 L1290,842 L1290,805" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="842" y="832" class="label">责任角色有界修复 → 重查、重审；契约变化需重新批准</text><rect x="45" y="915" width="1470" height="160" rx="7" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="65" y="949" class="name">事实与边界</text><text x="70" y="982" class="body">执行：产品批准 → 显式开发 → 上下文 / 任务 / 就绪 / 批准 → 实现 / 检查 / 评审 → 研发交付</text><text x="70" y="1012" class="body">恢复：原生 LibSQL 保存 phase、任务检查点和证据；就绪或评审失败仅接续失败阶段，不重放完成任务</text><text x="70" y="1042" class="body">范围：旧 Run 按原版本恢复；新页面接入、完整业务验收、跨库原子交接与生产部署仍为后续工作</text></svg>