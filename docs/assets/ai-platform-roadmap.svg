<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f8f7"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f2fa"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15796d"/>
      <stop offset="45%" stop-color="#3f6f91"/>
      <stop offset="100%" stop-color="#76599a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1b2733" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #17212b; }
      .subtitle { font-size: 21px; font-weight: 400; fill: #5e6b77; }
      .sectionTitle { font-size: 24px; font-weight: 700; fill: #17212b; }
      .version { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .versionTitle { font-size: 18px; font-weight: 700; fill: #1d2833; }
      .versionText { font-size: 14px; font-weight: 400; fill: #5c6b78; }
      .laneTitle { font-size: 17px; font-weight: 700; fill: #24313d; }
      .laneText { font-size: 14px; font-weight: 500; fill: #5e6d79; }
      .small { font-size: 14px; font-weight: 500; fill: #667582; }
      .card { fill: #ffffff; stroke: #d8e0e6; stroke-width: 1.3; filter: url(#shadow); }
      .lane { fill: rgba(255,255,255,.82); stroke: #dce3e8; stroke-width: 1.1; }
      .current { fill: #e8f7f2; stroke: #8fc9ba; stroke-width: 1.5; }
      .future { fill: #f4f6f8; stroke: #d7dfe5; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#background)"/>
  <rect x="46" y="40" width="1708" height="1078" rx="32" fill="rgba(255,255,255,.60)" stroke="#dce3e8"/>

  <text x="90" y="106" class="title">AI 应用基础平台演进路线</text>
  <text x="90" y="146" class="subtitle">ai-platform：从模型代理与 Demo，逐步成熟为可组合、可拆分的多项目基础平台</text>

  <rect x="90" y="190" width="1620" height="238" rx="26" class="card"/>
  <text x="124" y="234" class="sectionTitle">版本路线</text>
  <rect x="170" y="288" width="1450" height="10" rx="5" fill="url(#road)"/>

  <g transform="translate(130,260)">
    <circle cx="40" cy="32" r="34" fill="#15796d"/>
    <text x="21" y="38" class="version">V0</text>
    <text x="0" y="94" class="versionTitle">模型代理</text>
    <text x="-8" y="120" class="versionText">LiteLLM + Demo</text>
  </g>
  <g transform="translate(394,256)">
    <circle cx="40" cy="36" r="40" fill="#238778"/>
    <text x="7" y="42" class="version">V0.5</text>
    <text x="-4" y="98" class="versionTitle">当前分层</text>
    <text x="-26" y="124" class="versionText">Runtime / Gateway Client</text>
  </g>
  <g transform="translate(664,260)">
    <circle cx="40" cy="32" r="34" fill="#3f6f91"/>
    <text x="21" y="38" class="version">V1</text>
    <text x="-14" y="94" class="versionTitle">工具型 Agent</text>
    <text x="-22" y="120" class="versionText">工具循环 / 人工确认</text>
  </g>
  <g transform="translate(934,260)">
    <circle cx="40" cy="32" r="34" fill="#526b9a"/>
    <text x="21" y="38" class="version">V2</text>
    <text x="-18" y="94" class="versionTitle">受控模型入口</text>
    <text x="-26" y="120" class="versionText">Key / 预算 / 限流 / 路由</text>
  </g>
  <g transform="translate(1204,260)">
    <circle cx="40" cy="32" r="34" fill="#665f9b"/>
    <text x="21" y="38" class="version">V3</text>
    <text x="-18" y="94" class="versionTitle">知识增强服务</text>
    <text x="-24" y="120" class="versionText">解析 / 检索 / 权限 / 引用</text>
  </g>
  <g transform="translate(1474,260)">
    <circle cx="40" cy="32" r="34" fill="#76599a"/>
    <text x="21" y="38" class="version">V4</text>
    <text x="-20" y="94" class="versionTitle">AI 应用基础平台</text>
    <text x="-30" y="120" class="versionText">多项目 / 控制面 / 治理闭环</text>
  </g>

  <text x="90" y="488" class="sectionTitle">六个区域如何成熟</text>
  <rect x="90" y="516" width="1620" height="500" rx="26" class="card"/>

  <rect x="120" y="552" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="588" class="laneTitle">渠道与体验</text>
  <rect x="360" y="562" width="310" height="38" rx="10" class="current"/>
  <text x="382" y="587" class="laneText">V0-V0.5 Demo / 分层 API</text>
  <rect x="1180" y="562" width="460" height="38" rx="10" class="future"/>
  <text x="1202" y="587" class="laneText">V4 Web / IM / IDE / API Adapter</text>

  <rect x="120" y="626" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="662" class="laneTitle">平台控制面</text>
  <rect x="1180" y="636" width="460" height="38" rx="10" class="future"/>
  <text x="1202" y="661" class="laneText">V4 租户 / Agent 版本 / 策略发布</text>

  <rect x="120" y="700" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="736" class="laneTitle">Agent Runtime</text>
  <rect x="360" y="710" width="310" height="38" rx="10" class="current"/>
  <text x="382" y="735" class="laneText">V0.5 上下文 / 摘要 / 消息</text>
  <rect x="690" y="710" width="400" height="38" rx="10" class="future"/>
  <text x="712" y="735" class="laneText">V1 路由 / 工具循环 / 人工确认</text>

  <rect x="120" y="774" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="810" class="laneTitle">连接器与知识</text>
  <rect x="360" y="784" width="310" height="38" rx="10" class="current"/>
  <text x="382" y="809" class="laneText">V0.5 Tool Registry 预留</text>
  <rect x="690" y="784" width="400" height="38" rx="10" class="future"/>
  <text x="712" y="809" class="laneText">V1 业务 API / MCP / 搜索</text>
  <rect x="1110" y="784" width="530" height="38" rx="10" class="future"/>
  <text x="1132" y="809" class="laneText">V3 文档解析 / RAG / 权限 / 引用</text>

  <rect x="120" y="848" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="884" class="laneTitle">模型网关</text>
  <rect x="360" y="858" width="310" height="38" rx="10" class="current"/>
  <text x="382" y="883" class="laneText">V0-V0.5 LiteLLM / 模型别名</text>
  <rect x="850" y="858" width="500" height="38" rx="10" class="future"/>
  <text x="872" y="883" class="laneText">V2 virtual key / fallback / 预算限流</text>

  <rect x="120" y="922" width="1560" height="58" rx="14" class="lane"/>
  <text x="146" y="958" class="laneTitle">治理与可观测</text>
  <rect x="360" y="932" width="310" height="38" rx="10" class="current"/>
  <text x="382" y="957" class="laneText">当前 OpenSpec / docs / 回归评测</text>
  <rect x="850" y="932" width="790" height="38" rx="10" class="future"/>
  <text x="872" y="957" class="laneText">V2-V4 身份 / trace / 审计 / 评测 / 安全 / 反馈</text>

  <rect x="90" y="1046" width="1620" height="48" rx="16" fill="#17212b"/>
  <text x="124" y="1077" fill="#ffffff" style="font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">实施原则：先稳定模块契约，再按跨项目复用、独立安全边界、扩缩容或团队所有权逐个拆服务，不一次性平台化。</text>
</svg>
