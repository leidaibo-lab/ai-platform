<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8f7"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#182431" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f6273"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#82909d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #17212b; }
      .subtitle { font-size: 21px; font-weight: 400; fill: #5e6b77; }
      .regionTitle { font-size: 25px; font-weight: 700; fill: #17212b; }
      .regionCode { font-size: 15px; font-weight: 600; fill: #657380; }
      .nodeTitle { font-size: 18px; font-weight: 650; fill: #1d2833; }
      .nodeText { font-size: 15px; font-weight: 400; fill: #5a6977; }
      .small { font-size: 14px; font-weight: 500; fill: #667582; }
      .card { fill: #ffffff; stroke: #d8e0e6; stroke-width: 1.4; filter: url(#shadow); }
      .node { fill: rgba(255,255,255,.80); stroke: rgba(52,68,83,.14); stroke-width: 1.2; }
      .mainLine { fill: none; stroke: #4f6273; stroke-width: 3; marker-end: url(#arrow); }
      .bothLine { fill: none; stroke: #4f6273; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .policyLine { fill: none; stroke: #82909d; stroke-width: 2.4; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
      .governLine { fill: none; stroke: #bd6b5f; stroke-width: 2.2; stroke-dasharray: 7 8; marker-end: url(#arrowSoft); }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#background)"/>
  <rect x="46" y="40" width="1708" height="1110" rx="32" fill="rgba(255,255,255,.60)" stroke="#dce3e8"/>

  <text x="90" y="106" class="title">AI 应用基础平台目标架构</text>
  <text x="90" y="146" class="subtitle">ai-platform：按业务场景组合渠道、Runtime、连接器、知识、模型网关与治理能力</text>

  <path d="M440 337 C560 337 610 570 742 570" class="mainLine"/>
  <path d="M900 430 L900 508" class="policyLine"/>
  <path d="M770 430 C650 470 500 480 350 508" class="policyLine"/>
  <path d="M1030 430 C1180 470 1370 480 1450 508" class="policyLine"/>
  <path d="M610 662 L510 662" class="bothLine"/>
  <path d="M1110 662 L1240 662" class="mainLine"/>

  <rect x="100" y="190" width="340" height="240" rx="26" fill="#e8f7f2" class="card"/>
  <text x="132" y="236" class="regionTitle">渠道与体验层</text>
  <text x="132" y="264" class="regionCode">channel-adapter-*</text>
  <rect x="132" y="294" width="276" height="52" rx="14" class="node"/>
  <text x="156" y="326" class="nodeTitle">开发 Demo / Web</text>
  <rect x="132" y="360" width="276" height="44" rx="14" class="node"/>
  <text x="156" y="388" class="nodeText">IM / IDE / API Adapter</text>

  <rect x="610" y="190" width="580" height="240" rx="26" fill="#eaf1ff" class="card"/>
  <text x="644" y="236" class="regionTitle">平台控制面</text>
  <text x="644" y="264" class="regionCode">platform-control</text>
  <rect x="644" y="294" width="246" height="52" rx="14" class="node"/>
  <text x="668" y="326" class="nodeTitle">租户 / 用户 / 应用</text>
  <rect x="910" y="294" width="246" height="52" rx="14" class="node"/>
  <text x="934" y="326" class="nodeTitle">Agent 定义 / 发布</text>
  <rect x="644" y="360" width="512" height="44" rx="14" class="node"/>
  <text x="668" y="388" class="nodeText">版本化 AgentDefinition / ToolPolicy / ModelPolicy</text>

  <rect x="100" y="508" width="410" height="350" rx="26" fill="#fff5df" class="card"/>
  <text x="132" y="556" class="regionTitle">连接器与知识层</text>
  <text x="132" y="584" class="regionCode">connector-service / knowledge-service</text>
  <rect x="132" y="618" width="346" height="54" rx="14" class="node"/>
  <text x="158" y="651" class="nodeTitle">Tool Executor / MCP</text>
  <rect x="132" y="690" width="346" height="54" rx="14" class="node"/>
  <text x="158" y="723" class="nodeTitle">业务 API / 搜索 / 网页</text>
  <rect x="132" y="762" width="346" height="54" rx="14" class="node"/>
  <text x="158" y="795" class="nodeTitle">文档解析 / RAG / 知识权限</text>

  <rect x="610" y="508" width="500" height="350" rx="26" fill="#e8f2ff" class="card"/>
  <text x="644" y="556" class="regionTitle">Agent Runtime</text>
  <text x="644" y="584" class="regionCode">agent-runtime</text>
  <rect x="644" y="618" width="432" height="54" rx="14" class="node"/>
  <text x="670" y="651" class="nodeTitle">Run API / 会话 / 上下文</text>
  <rect x="644" y="690" width="432" height="54" rx="14" class="node"/>
  <text x="670" y="723" class="nodeTitle">任务路由 / 工具循环 / 结果组装</text>
  <rect x="644" y="762" width="432" height="54" rx="14" class="node"/>
  <text x="670" y="795" class="nodeTitle">人工确认 / 失败兜底 / 任务状态</text>

  <rect x="1240" y="508" width="460" height="350" rx="26" fill="#f1eaff" class="card"/>
  <text x="1274" y="556" class="regionTitle">模型网关</text>
  <text x="1274" y="584" class="regionCode">model-gateway</text>
  <rect x="1274" y="618" width="392" height="54" rx="14" class="node"/>
  <text x="1300" y="651" class="nodeTitle">OpenAI-compatible API</text>
  <rect x="1274" y="690" width="392" height="54" rx="14" class="node"/>
  <text x="1300" y="723" class="nodeTitle">模型别名 / 路由 / fallback</text>
  <rect x="1274" y="762" width="392" height="54" rx="14" class="node"/>
  <text x="1300" y="795" class="nodeTitle">virtual key / provider key / 预算限流</text>

  <rect x="100" y="930" width="1600" height="154" rx="26" fill="#fff0ec" class="card"/>
  <text x="132" y="978" class="regionTitle">治理与可观测</text>
  <text x="132" y="1006" class="regionCode">governance-service</text>
  <rect x="380" y="962" width="370" height="72" rx="16" class="node"/>
  <text x="408" y="994" class="nodeTitle">身份上下文 / 策略</text>
  <text x="408" y="1018" class="nodeText">tenantId / appId / userId / requestId</text>
  <rect x="780" y="962" width="370" height="72" rx="16" class="node"/>
  <text x="808" y="994" class="nodeTitle">调用追踪 / 审计</text>
  <text x="808" y="1018" class="nodeText">trace / audit event / usage</text>
  <rect x="1180" y="962" width="470" height="72" rx="16" class="node"/>
  <text x="1208" y="994" class="nodeTitle">评测 / 安全 / 反馈闭环</text>
  <text x="1208" y="1018" class="nodeText">evaluation / guardrail / feedback</text>

  <path d="M565 962 C565 910 810 904 810 858" class="governLine"/>
  <path d="M965 962 C965 912 1450 912 1450 858" class="governLine"/>
  <path d="M1415 962 C1415 900 350 904 350 858" class="governLine"/>

  <text x="100" y="1122" class="small">实线：运行时主调用；双向实线：工具调用与结果回填；虚线：版本化策略与治理关系。各区域可按业务需要独立部署。</text>
</svg>
