<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7f4"/>
      <stop offset="48%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="access" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff6ef"/>
      <stop offset="100%" stop-color="#f5fffb"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f0ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="tools" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4dd"/>
      <stop offset="100%" stop-color="#fffdf6"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e9ff"/>
      <stop offset="100%" stop-color="#fbf8ff"/>
    </linearGradient>
    <linearGradient id="gov" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffece8"/>
      <stop offset="100%" stop-color="#fff9f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#48596a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#778694"/>
    </marker>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #13202c; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526273; }
      .stage { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f7b6c; letter-spacing: .4px; }
      .layerTitle { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .layerDesc { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5e6d7a; }
      .nodeTitle { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .nodeText { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5a6977; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6a7885; }
      .badgeText { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #48596a; stroke-width: 3.2; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #778694; stroke-width: 2.6; stroke-dasharray: 7 8; marker-end: url(#arrowSoft); }
      .card { stroke: rgba(39, 53, 69, .13); stroke-width: 1.5; filter: url(#shadow); }
      .node { fill: #ffffff; stroke: rgba(39, 53, 69, .15); stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#bg)"/>
  <rect x="46" y="42" width="1708" height="1076" rx="34" fill="rgba(255,255,255,.58)" stroke="rgba(39,53,69,.10)"/>

  <text x="90" y="108" class="title">AI Gateway 当前落地总图</text>
  <text x="90" y="146" class="subtitle">V0.5：本地模型代理已分层，进入 V1-ready 状态</text>
  <rect x="1432" y="74" width="210" height="42" rx="21" fill="#0f7b6c"/>
  <text x="1496" y="102" class="badgeText">当前阶段 V0.5</text>

  <rect x="96" y="198" width="318" height="780" rx="28" fill="url(#access)" class="card"/>
  <text x="132" y="248" class="layerTitle">接入层</text>
  <text x="132" y="280" class="layerDesc">面向用户、浏览器和客户端</text>
  <rect x="132" y="324" width="246" height="92" rx="18" class="node"/>
  <text x="158" y="360" class="nodeTitle">浏览器 Demo</text>
  <text x="158" y="388" class="nodeText">demo/index.html</text>
  <rect x="132" y="446" width="246" height="116" rx="18" class="node"/>
  <text x="158" y="482" class="nodeTitle">分层 API</text>
  <text x="158" y="510" class="nodeText">/api/gateway/status</text>
  <text x="158" y="536" class="nodeText">/api/runtime/chat</text>
  <rect x="132" y="592" width="246" height="94" rx="18" class="node"/>
  <text x="158" y="628" class="nodeTitle">客户端直连</text>
  <text x="158" y="656" class="nodeText">Cursor / 内部脚本</text>

  <rect x="482" y="198" width="372" height="780" rx="28" fill="url(#runtime)" class="card"/>
  <text x="520" y="248" class="layerTitle">智能体 / 工作流运行层</text>
  <text x="520" y="280" class="layerDesc">负责上下文、摘要和消息组装</text>
  <rect x="520" y="324" width="296" height="108" rx="18" class="node"/>
  <text x="548" y="360" class="nodeTitle">聊天运行</text>
  <text x="548" y="388" class="nodeText">src/runtime/chat-runtime.mjs</text>
  <rect x="520" y="468" width="296" height="108" rx="18" class="node"/>
  <text x="548" y="504" class="nodeTitle">消息构造</text>
  <text x="548" y="532" class="nodeText">文本 / 图片 / 文档链接</text>
  <rect x="520" y="612" width="296" height="108" rx="18" class="node"/>
  <text x="548" y="648" class="nodeTitle">上下文预算</text>
  <text x="548" y="676" class="nodeText">summary + history 裁剪</text>
  <rect x="520" y="756" width="296" height="88" rx="18" fill="#eef5ff" stroke="rgba(39,53,69,.14)"/>
  <text x="548" y="790" class="nodeTitle">当前边界</text>
  <text x="548" y="818" class="nodeText">还没有真实工具循环</text>

  <rect x="922" y="198" width="306" height="780" rx="28" fill="url(#tools)" class="card"/>
  <text x="960" y="248" class="layerTitle">工具注册与连接器层</text>
  <text x="960" y="280" class="layerDesc">先预留，后续接工具</text>
  <rect x="960" y="324" width="230" height="108" rx="18" class="node"/>
  <text x="986" y="360" class="nodeTitle">工具注册预留</text>
  <text x="986" y="388" class="nodeText">src/tools/tool-registry.mjs</text>
  <rect x="960" y="470" width="230" height="92" rx="18" fill="#fff8e6" stroke="rgba(39,53,69,.14)" stroke-dasharray="8 8"/>
  <text x="986" y="506" class="nodeTitle">下一步工具</text>
  <text x="986" y="534" class="nodeText">MCP / 搜索 / 业务 API</text>

  <rect x="1296" y="198" width="408" height="780" rx="28" fill="url(#gateway)" class="card"/>
  <text x="1334" y="248" class="layerTitle">模型网关层</text>
  <text x="1334" y="280" class="layerDesc">模型别名、密钥收口、上游转发</text>
  <rect x="1334" y="324" width="294" height="108" rx="18" class="node"/>
  <text x="1362" y="360" class="nodeTitle">LiteLLM Client</text>
  <text x="1362" y="388" class="nodeText">src/gateway/litellm-client.mjs</text>
  <rect x="1334" y="468" width="294" height="108" rx="18" class="node"/>
  <text x="1362" y="504" class="nodeTitle">LiteLLM Proxy :4000</text>
  <text x="1362" y="532" class="nodeText">config.yaml / chat-default</text>
  <rect x="1334" y="612" width="294" height="108" rx="18" class="node"/>
  <text x="1362" y="648" class="nodeTitle">上游模型服务</text>
  <text x="1362" y="676" class="nodeText">OpenAI-compatible API</text>

  <rect x="96" y="1012" width="1608" height="78" rx="24" fill="url(#gov)" class="card"/>
  <text x="132" y="1058" class="layerTitle">治理与运营层</text>
  <text x="328" y="1058" class="nodeText">当前：OpenSpec 稳定契约、README / docs、scripts/test-chat.sh；尚未接入身份、预算、限流、审计和评测运营。</text>

  <path d="M378 492 C430 492 450 378 520 378" class="line"/>
  <path d="M816 378 C878 378 898 378 960 378" class="softLine"/>
  <path d="M816 668 C1038 668 1118 378 1334 378" class="line"/>
  <path d="M1481 432 L1481 468" class="line"/>
  <path d="M1481 576 L1481 612" class="line"/>
  <path d="M378 638 C748 638 962 522 1334 522" class="line"/>

  <text x="90" y="1120" class="small">读图：当前已经从单文件 Demo 拆成接入层、runtime、gateway client 和工具预留层；下一步才进入 V1 的真实工具循环。</text>
</svg>
