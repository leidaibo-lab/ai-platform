<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Gateway Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f9;
        --panel: #ffffff;
        --panel-muted: #eef3f8;
        --text: #17212b;
        --muted: #667381;
        --line: #d8e0e8;
        --accent: #0f7b6c;
        --accent-strong: #095c51;
        --warn: #a4441f;
        --shadow: 0 12px 32px rgba(36, 48, 61, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(15, 123, 108, 0.09), transparent 42%),
          linear-gradient(315deg, rgba(74, 107, 142, 0.11), transparent 38%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        width: min(1040px, calc(100vw - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 8px 20px rgba(36, 48, 61, 0.08);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: #0f7b6c;
        color: white;
        font-weight: 750;
      }

      .title {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d0dae3;
      }

      .dot.ok {
        background: #1f9d78;
        box-shadow: 0 0 0 4px rgba(31, 157, 120, 0.14);
      }

      .dot.bad {
        background: #c05a2b;
        box-shadow: 0 0 0 4px rgba(192, 90, 43, 0.14);
      }

      .workspace {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 16px;
        min-height: 0;
      }

      .conversation,
      .side {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
      }

      .conversation {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 560px;
        overflow: hidden;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 18px;
        overflow: auto;
      }

      .message {
        max-width: min(720px, 92%);
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      .message.user {
        align-self: flex-end;
        background: #e8f4f0;
        border-color: #badbd2;
      }

      .message.assistant {
        align-self: flex-start;
        background: var(--panel);
      }

      .message.error {
        align-self: flex-start;
        background: #fff1ea;
        border-color: #f0c4ad;
        color: var(--warn);
      }

      .composer {
        position: relative;
        padding: 14px;
        border-top: 1px solid var(--line);
        background: var(--panel-muted);
      }

      .composer-box {
        display: grid;
        gap: 12px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: white;
        box-shadow: 0 8px 20px rgba(36, 48, 61, 0.08);
      }

      .message-input {
        width: 100%;
        min-height: 54px;
        max-height: 160px;
        resize: none;
        border: 0;
        padding: 2px 2px 0;
        color: var(--text);
        background: transparent;
        outline: none;
        overflow: auto;
        line-height: 1.55;
      }

      .composer-box:focus-within {
        border-color: rgba(15, 123, 108, 0.72);
        box-shadow:
          0 8px 20px rgba(36, 48, 61, 0.08),
          0 0 0 4px rgba(15, 123, 108, 0.12);
      }

      .attachment-note,
      .link-label {
        color: var(--muted);
        font-size: 12px;
      }

      .attachments {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .attachment-card {
        position: relative;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        width: min(240px, 100%);
        min-height: 52px;
        padding: 6px 30px 6px 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fbfd;
      }

      .attachment-thumb {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: #e8f4f0;
        color: var(--accent-strong);
        font-weight: 800;
        overflow: hidden;
      }

      .attachment-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .attachment-meta {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .attachment-title,
      .attachment-subtitle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .attachment-title {
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
      }

      .attachment-subtitle {
        color: var(--muted);
        font-size: 12px;
      }

      .remove-attachment {
        position: absolute;
        top: 5px;
        right: 5px;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 999px;
        background: rgba(23, 33, 43, 0.08);
        color: var(--text);
        cursor: pointer;
      }

      .remove-attachment:hover {
        background: rgba(23, 33, 43, 0.14);
      }

      .link-adder {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px dashed #badbd2;
        border-radius: 8px;
        background: #f4fbf8;
      }

      .link-adder[hidden],
      .attachments[hidden],
      .add-menu[hidden] {
        display: none;
      }

      .link-input-row,
      .composer-toolbar,
      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .link-input {
        width: 100%;
        min-width: 0;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        color: var(--text);
        background: white;
        outline: none;
      }

      .link-input:focus {
        border-color: rgba(15, 123, 108, 0.72);
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      .composer-toolbar {
        justify-content: space-between;
      }

      .toolbar-left {
        position: relative;
      }

      .icon-button,
      .link-action {
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: white;
        color: var(--text);
        cursor: pointer;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        font-size: 22px;
        line-height: 1;
      }

      .icon-button:hover,
      .link-action:hover {
        border-color: rgba(15, 123, 108, 0.7);
        color: var(--accent-strong);
      }

      .add-menu {
        position: absolute;
        bottom: 42px;
        left: 0;
        z-index: 2;
        display: grid;
        gap: 6px;
        min-width: 156px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        box-shadow: var(--shadow);
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 34px;
        border: 0;
        border-radius: 8px;
        padding: 0 9px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .menu-item:hover {
        background: #eef3f8;
      }

      .menu-icon {
        width: 18px;
        text-align: center;
      }

      .link-action {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        font-size: 18px;
      }

      .send {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
      }

      .send:hover {
        background: var(--accent-strong);
      }

      .send:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
      }

      .metric {
        display: grid;
        gap: 6px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .metric:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .label {
        color: var(--muted);
        font-size: 12px;
      }

      .value {
        color: var(--text);
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .prompts {
        display: grid;
        gap: 8px;
      }

      .prompt {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: white;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .prompt:hover {
        border-color: rgba(15, 123, 108, 0.7);
      }

      .footer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100vw - 20px, 1040px);
          padding: 10px 0;
        }

        .topbar,
        .workspace {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .conversation {
          min-height: 520px;
        }

        .side {
          order: -1;
        }

        .composer {
          padding: 10px;
        }

        .composer-box {
          padding: 10px;
        }

        .attachment-card {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark">AG</div>
          <div class="title">
            <h1>AI Gateway Demo</h1>
            <div class="subtitle" id="endpoint">localhost</div>
          </div>
        </div>
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">检查中</span>
        </div>
      </header>

      <section class="workspace">
        <div class="conversation">
          <div class="messages" id="messages">
            <div class="message assistant">本地网关已接入，可以发送文字、图片和文档链接。</div>
          </div>
          <form class="composer" id="form">
            <div class="composer-box">
              <div class="attachments" id="attachments" hidden></div>
              <textarea class="message-input" id="messageInput" rows="2" placeholder="输入消息，或用左下角 + 追加图片/文档链接" autocomplete="off">用一句话说明当前 AI Gateway 是否生效。</textarea>

              <div class="link-adder" id="linkAdder" hidden>
                <div class="link-label" id="linkLabel">追加链接</div>
                <div class="link-input-row">
                  <input class="link-input" id="linkInput" type="url" placeholder="https://example.com" autocomplete="off" />
                  <button class="link-action" id="confirmLink" type="button" title="添加链接" aria-label="添加链接">+</button>
                  <button class="link-action" id="cancelLink" type="button" title="取消" aria-label="取消">×</button>
                </div>
              </div>

              <div class="composer-toolbar">
                <div class="toolbar-left">
                  <button class="icon-button" id="openAddMenu" type="button" title="添加内容" aria-label="添加内容">+</button>
                  <div class="add-menu" id="addMenu" hidden>
                    <button class="menu-item" id="chooseImageButton" type="button"><span class="menu-icon">▣</span><span>上传图片</span></button>
                    <button class="menu-item" type="button" data-link-type="image"><span class="menu-icon">◎</span><span>图片链接</span></button>
                    <button class="menu-item" type="button" data-link-type="document"><span class="menu-icon">#</span><span>文档链接</span></button>
                  </div>
                  <span class="attachment-note" id="attachmentNote">可追加图片或文档链接</span>
                </div>
                <button class="send" id="send" type="submit" title="发送" aria-label="发送">↑</button>
                <input class="file-input" id="imageFileInput" type="file" accept="image/*" multiple />
              </div>
            </div>
          </form>
        </div>

        <aside class="side">
          <div class="metric">
            <div class="label">模型别名</div>
            <div class="value" id="model">chat-default</div>
          </div>
          <div class="metric">
            <div class="label">最近耗时</div>
            <div class="value" id="latency">-</div>
          </div>
          <div class="metric">
            <div class="label">最近状态</div>
            <div class="value" id="lastStatus">等待请求</div>
          </div>
          <div class="metric">
            <div class="label">上下文</div>
            <div class="value" id="contextCount">0 条消息</div>
          </div>
          <div class="metric">
            <div class="label">图片输入</div>
            <div class="value">上传图片或图片 URL</div>
          </div>
          <div class="metric">
            <div class="label">文档链接</div>
            <div class="value">作为文本链接传入</div>
          </div>
          <div class="metric prompts">
            <button class="prompt" type="button" data-message="用三点总结 LiteLLM Proxy 的作用。">总结网关</button>
            <button class="prompt" type="button" data-message="请分析这张图片里的主体、文字和可能的业务含义。">分析图片</button>
            <button class="prompt" type="button" data-message="请基于这个文档链接总结重点；如果无法访问链接，请说明原因。">总结文档链接</button>
            <button class="prompt" id="clearContext" type="button">清空上下文</button>
          </div>
        </aside>
      </section>

      <div class="footer">API Key 由本地 demo server 从 .env 读取；文档内图片需要单独上传或提供图片直链。</div>
    </main>

    <script>
      const messages = document.querySelector("#messages");
      const form = document.querySelector("#form");
      const messageInput = document.querySelector("#messageInput");
      const attachments = document.querySelector("#attachments");
      const linkAdder = document.querySelector("#linkAdder");
      const linkLabel = document.querySelector("#linkLabel");
      const linkInput = document.querySelector("#linkInput");
      const confirmLink = document.querySelector("#confirmLink");
      const cancelLink = document.querySelector("#cancelLink");
      const openAddMenu = document.querySelector("#openAddMenu");
      const addMenu = document.querySelector("#addMenu");
      const chooseImageButton = document.querySelector("#chooseImageButton");
      const imageFileInput = document.querySelector("#imageFileInput");
      const attachmentNote = document.querySelector("#attachmentNote");
      const send = document.querySelector("#send");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const endpoint = document.querySelector("#endpoint");
      const model = document.querySelector("#model");
      const latency = document.querySelector("#latency");
      const lastStatus = document.querySelector("#lastStatus");
      const contextCount = document.querySelector("#contextCount");
      const clearContext = document.querySelector("#clearContext");
      const maxImageCount = 4;
      const maxImageBytes = 5 * 1024 * 1024;
      const maxRecentHistoryMessages = 8;
      const maxRequestHistoryChars = 12000;
      let attachedImages = [];
      let attachedDocuments = [];
      let conversationHistory = [];
      let conversationSummary = "";
      let isSummarizing = false;
      let activeLinkType = "image";
      let isComposing = false;

      function addMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
        return node;
      }

      function setHealth(ok, text) {
        statusDot.className = `dot ${ok ? "ok" : "bad"}`;
        statusText.textContent = text;
      }

      async function loadStatus() {
        try {
          const res = await fetch("/api/gateway/status");
          const data = await res.json();
          endpoint.textContent = data.gatewayBaseUrl;
          model.textContent = data.model;
          setHealth(data.ok, data.ok ? "已连接" : "未连接");
          if (!data.ok && data.error) {
            lastStatus.textContent = data.error;
          }
        } catch (error) {
          setHealth(false, "未连接");
          lastStatus.textContent = error.message;
        }
      }

      function parseUrlList(value) {
        return [...new Set(value.split(/[\s,，]+/).map((url) => url.trim()).filter(Boolean))];
      }

      function getImageUrls() {
        return attachedImages.map((image) => image.url);
      }

      function getDocumentUrls() {
        return attachedDocuments.map((document) => document.url);
      }

      function buildPayload() {
        return {
          message: messageInput.value.trim(),
          imageUrls: getImageUrls(),
          documentUrls: getDocumentUrls(),
          summary: conversationSummary,
          history: selectHistoryForRequest(),
        };
      }

      function hasPayloadContent(payload) {
        return payload.message || payload.imageUrls.length > 0 || payload.documentUrls.length > 0;
      }

      function formatUserMessage(payload) {
        const sections = [];
        if (payload.message) sections.push(payload.message);
        if (payload.imageUrls.length > 0) sections.push(`图片：${payload.imageUrls.length} 个`);
        if (payload.documentUrls.length > 0) {
          sections.push(`文档链接：\n${payload.documentUrls.map((url) => `- ${url}`).join("\n")}`);
        }
        return sections.join("\n\n");
      }

      function resetComposer() {
        messageInput.value = "";
        attachedImages = [];
        attachedDocuments = [];
        closeLinkAdder();
        closeAddMenu();
        renderAttachments();
        resizeInput();
      }

      async function ask(payload) {
        const startedAt = performance.now();
        const userText = formatUserMessage(payload);
        addMessage("user", userText);
        const pending = addMessage("assistant", "请求中...");
        send.disabled = true;
        lastStatus.textContent = "请求中";
        latency.textContent = "-";

        try {
          const res = await fetch("/api/runtime/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          const elapsed = Math.round(performance.now() - startedAt);
          latency.textContent = `${elapsed} ms`;
          if (!res.ok) {
            pending.className = "message error";
            pending.textContent = data.error || "请求失败";
            lastStatus.textContent = `HTTP ${res.status}`;
            return;
          }

          const assistantText = data.content || "(空响应)";
          pending.textContent = assistantText;
          appendHistory("user", userText);
          appendHistory("assistant", assistantText);
          await compactHistoryIfNeeded();
          lastStatus.textContent = "成功";
          setHealth(true, "已连接");
        } catch (error) {
          pending.className = "message error";
          pending.textContent = error.message;
          lastStatus.textContent = "请求失败";
          setHealth(false, "未连接");
        } finally {
          send.disabled = false;
          messageInput.focus();
        }
      }

      function autoResize(field) {
        field.style.height = "auto";
        field.style.height = `${Math.min(field.scrollHeight, 160)}px`;
      }

      function resizeInput() {
        autoResize(messageInput);
      }

      function appendHistory(role, content) {
        conversationHistory.push({ role, content });
        updateContextCount();
      }

      function clearConversationContext() {
        conversationHistory = [];
        conversationSummary = "";
        updateContextCount();
        lastStatus.textContent = "上下文已清空";
        messageInput.focus();
      }

      function updateContextCount() {
        const summaryText = conversationSummary ? "，有摘要" : "，无摘要";
        contextCount.textContent = `${conversationHistory.length} 条近期消息${summaryText}`;
      }

      function selectHistoryForRequest() {
        const selected = [];
        let used = 0;

        for (const item of conversationHistory.slice().reverse()) {
          const cost = item.content.length;
          if (used + cost > maxRequestHistoryChars) break;
          selected.unshift(item);
          used += cost;
        }

        return selected;
      }

      async function compactHistoryIfNeeded() {
        if (isSummarizing || conversationHistory.length <= maxRecentHistoryMessages) return;

        const overflowCount = conversationHistory.length - maxRecentHistoryMessages;
        const messagesToSummarize = conversationHistory.slice(0, overflowCount);
        const recentMessages = conversationHistory.slice(overflowCount);
        isSummarizing = true;
        lastStatus.textContent = "压缩上下文";

        try {
          const res = await fetch("/api/runtime/summaries", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              summary: conversationSummary,
              messages: messagesToSummarize,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "上下文压缩失败");
          conversationSummary = data.summary || conversationSummary;
          conversationHistory = recentMessages;
        } catch (error) {
          addMessage("error", `上下文压缩失败：${error.message}`);
        } finally {
          isSummarizing = false;
          updateContextCount();
        }
      }

      function updateAttachmentNote() {
        const imageCount = attachedImages.length;
        const documentCount = attachedDocuments.length;
        if (imageCount === 0 && documentCount === 0) {
          attachmentNote.textContent = "可追加图片或文档链接";
          return;
        }
        attachmentNote.textContent = `已追加图片 ${imageCount} 个，文档链接 ${documentCount} 个`;
      }

      function renderAttachments() {
        const items = [
          ...attachedImages.map((image) => ({ ...image, type: "image" })),
          ...attachedDocuments.map((document) => ({ ...document, type: "document" })),
        ];
        attachments.textContent = "";
        attachments.hidden = items.length === 0;

        for (const item of items) {
          const card = document.createElement("div");
          card.className = "attachment-card";

          const thumb = document.createElement("div");
          thumb.className = "attachment-thumb";
          if (item.type === "image") {
            const image = document.createElement("img");
            image.src = item.url;
            image.alt = item.name;
            image.addEventListener("error", () => {
              thumb.textContent = "IMG";
            });
            thumb.appendChild(image);
          } else {
            thumb.textContent = "DOC";
          }

          const meta = document.createElement("div");
          meta.className = "attachment-meta";
          const title = document.createElement("div");
          title.className = "attachment-title";
          title.textContent = item.name;
          const subtitle = document.createElement("div");
          subtitle.className = "attachment-subtitle";
          subtitle.textContent = item.type === "image" ? formatImageSubtitle(item) : "文档链接";
          meta.append(title, subtitle);

          const remove = document.createElement("button");
          remove.className = "remove-attachment";
          remove.type = "button";
          remove.textContent = "×";
          remove.setAttribute("aria-label", `移除 ${item.name}`);
          remove.addEventListener("click", () => {
            if (item.type === "image") {
              attachedImages = attachedImages.filter((image) => image.id !== item.id);
            } else {
              attachedDocuments = attachedDocuments.filter((document) => document.id !== item.id);
            }
            renderAttachments();
          });

          card.append(thumb, meta, remove);
          attachments.appendChild(card);
        }

        updateAttachmentNote();
      }

      async function addImageFiles(files) {
        const images = files.filter((file) => file.type.startsWith("image/"));
        if (images.length !== files.length) {
          addMessage("error", "只能上传图片文件。");
        }
        for (const file of images) {
          if (attachedImages.length >= maxImageCount) {
            addMessage("error", `最多上传 ${maxImageCount} 张图片。`);
            break;
          }
          if (file.size > maxImageBytes) {
            addMessage("error", `${file.name} 超过 5 MB，未添加。`);
            continue;
          }
          const url = await readFileAsDataUrl(file);
          attachedImages.push({
            id: `${file.name}-${file.lastModified}-${Math.random().toString(36).slice(2)}`,
            name: file.name,
            size: file.size,
            source: "file",
            url,
          });
        }
        renderAttachments();
      }

      function addLink(type) {
        const urls = parseUrlList(linkInput.value);
        if (urls.length === 0) return;

        if (type === "image") {
          for (const url of urls) {
            if (attachedImages.length >= maxImageCount) {
              addMessage("error", `最多追加 ${maxImageCount} 张图片。`);
              break;
            }
            attachedImages.push({
              id: `image-url-${Date.now()}-${Math.random().toString(36).slice(2)}`,
              name: readableName(url, "图片链接"),
              source: "url",
              url,
            });
          }
        } else {
          for (const url of urls) {
            attachedDocuments.push({
              id: `document-url-${Date.now()}-${Math.random().toString(36).slice(2)}`,
              name: readableName(url, "文档链接"),
              url,
            });
          }
        }

        closeLinkAdder();
        renderAttachments();
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error || new Error("图片读取失败"));
          reader.readAsDataURL(file);
        });
      }

      function formatSize(size) {
        if (!size) return "";
        if (size < 1024 * 1024) return `${Math.max(1, Math.round(size / 1024))} KB`;
        return `${(size / 1024 / 1024).toFixed(1)} MB`;
      }

      function formatImageSubtitle(image) {
        return image.source === "file" ? `本地图片 ${formatSize(image.size)}` : "图片链接";
      }

      function readableName(value, fallback) {
        try {
          const url = new URL(value);
          const leaf = decodeURIComponent(url.pathname.split("/").filter(Boolean).pop() || "");
          return leaf || url.hostname || fallback;
        } catch {
          return fallback;
        }
      }

      function openLinkAdder(type) {
        activeLinkType = type;
        closeAddMenu();
        linkAdder.hidden = false;
        linkLabel.textContent = type === "image" ? "追加图片链接" : "追加文档链接";
        linkInput.placeholder = type === "image" ? "https://example.com/image.png" : "https://example.com/doc";
        linkInput.value = "";
        linkInput.focus();
      }

      function closeLinkAdder() {
        linkAdder.hidden = true;
        linkInput.value = "";
      }

      function toggleAddMenu() {
        addMenu.hidden = !addMenu.hidden;
        openAddMenu.setAttribute("aria-expanded", String(!addMenu.hidden));
      }

      function closeAddMenu() {
        addMenu.hidden = true;
        openAddMenu.setAttribute("aria-expanded", "false");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const payload = buildPayload();
        if (!hasPayloadContent(payload)) return;
        resetComposer();
        ask(payload);
      });

      document.querySelectorAll(".prompt").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.id === "clearContext") return;
          messageInput.value = button.dataset.message || button.textContent.trim();
          autoResize(messageInput);
          messageInput.focus();
        });
      });

      messageInput.addEventListener("input", resizeInput);
      messageInput.addEventListener("compositionstart", () => {
        isComposing = true;
      });
      messageInput.addEventListener("compositionend", () => {
        isComposing = false;
      });
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      imageFileInput.addEventListener("change", async () => {
        try {
          await addImageFiles([...imageFileInput.files]);
        } catch (error) {
          addMessage("error", error.message || "图片读取失败");
        } finally {
          imageFileInput.value = "";
        }
      });

      openAddMenu.addEventListener("click", toggleAddMenu);
      clearContext.addEventListener("click", clearConversationContext);
      chooseImageButton.addEventListener("click", () => {
        closeAddMenu();
        imageFileInput.click();
      });
      addMenu.querySelectorAll("[data-link-type]").forEach((button) => {
        button.addEventListener("click", () => {
          openLinkAdder(button.dataset.linkType);
        });
      });
      confirmLink.addEventListener("click", () => {
        addLink(activeLinkType);
      });
      cancelLink.addEventListener("click", closeLinkAdder);
      linkInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addLink(activeLinkType);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeAddMenu();
          closeLinkAdder();
        }
      });

      resizeInput();
      updateAttachmentNote();
      updateContextCount();
      loadStatus();
    </script>
  </body>
</html>
