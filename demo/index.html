<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 应用基础平台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f7;
        --panel: #ffffff;
        --panel-muted: #f6f8fa;
        --text: #18212b;
        --muted: #687481;
        --line: #d8dfe6;
        --accent: #147565;
        --accent-soft: #e5f2ee;
        --danger: #a5452b;
        --danger-soft: #fff0eb;
        --info: #315f8b;
        --shadow: 0 8px 22px rgba(27, 39, 51, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, textarea { font: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
        width: min(1440px, calc(100vw - 24px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 12px 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 500;
      }
      h1 { margin: 0; font-size: 17px; letter-spacing: 0; }
      .subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .health { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #aeb8c2; }
      .dot.ok { background: #218563; }
      .dot.bad { background: var(--danger); }

      .workspace {
        display: grid;
        grid-template-columns: 232px minmax(420px, 1fr) 272px;
        gap: 12px;
        min-height: 0;
      }
      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
        min-height: 48px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .panel-title { min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .icon-button, .send-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      .icon-button:hover { border-color: var(--accent); color: var(--accent); }
      .icon-button:disabled, .send-button:disabled { cursor: not-allowed; opacity: 0.45; }

      .sessions { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
      .session-list { min-height: 0; padding: 6px; overflow: auto; }
      .session-item {
        display: grid;
        gap: 4px;
        width: 100%;
        margin: 0 0 4px;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }
      .session-item:hover { background: var(--panel-muted); }
      .session-item.active { background: var(--accent-soft); }
      .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .session-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
      .session-footer { padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

      .conversation { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 640px; overflow: hidden; }
      .conversation-status { color: var(--muted); font-size: 12px; }
      .messages { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; padding: 16px; overflow: auto; }
      .message {
        max-width: min(760px, 88%);
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
      }
      .message.user { align-self: flex-end; border-color: #b9d8ce; background: var(--accent-soft); }
      .message.assistant { align-self: flex-start; }
      .message.pending { color: var(--muted); }
      .message.streaming::after {
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 3px;
        background: var(--accent);
        vertical-align: -0.12em;
        content: "";
        animation: stream-caret 0.9s steps(1) infinite;
      }
      .message.error { align-self: flex-start; border-color: #ecc0b1; background: var(--danger-soft); color: var(--danger); }
      .empty-state { margin: auto; color: var(--muted); font-size: 13px; }

      @keyframes stream-caret { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .message.streaming::after { animation: none; } }

      .composer { position: relative; min-width: 0; padding: 12px; border-top: 1px solid var(--line); background: var(--panel-muted); }
      .composer-box { display: grid; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
      .message-input { width: 100%; min-height: 52px; max-height: 160px; resize: none; border: 0; outline: 0; color: var(--text); background: transparent; line-height: 1.5; }
      .composer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .toolbar-left { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; }
      .attachment-note { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .send-button { border-color: var(--accent); background: var(--accent); color: #ffffff; }
      .add-menu {
        position: absolute;
        left: 0;
        bottom: 42px;
        z-index: 4;
        width: 160px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .menu-item { width: 100%; padding: 8px 9px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; text-align: left; }
      .menu-item:hover { background: var(--panel-muted); }
      .file-input { display: none; }
      .link-adder { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; }
      .link-input { min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; }
      .link-action { width: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
      .attachments { display: flex; gap: 7px; flex-wrap: wrap; }
      .attachment { display: flex; align-items: center; gap: 7px; max-width: 220px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-muted); }
      .attachment-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .attachment-remove { border: 0; background: transparent; color: var(--muted); cursor: pointer; }

      .inspector { min-height: 0; overflow: auto; }
      .metric { padding: 11px 12px; border-bottom: 1px solid var(--line); }
      .metric-label { color: var(--muted); font-size: 11px; }
      .metric-value { margin-top: 4px; font-size: 13px; overflow-wrap: anywhere; }
      .memory-list { display: grid; gap: 6px; padding: 10px 12px; }
      .memory-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .memory-item:last-child { border-bottom: 0; }
      .memory-key { color: var(--info); font-size: 11px; }
      .memory-value { margin-top: 3px; font-size: 12px; overflow-wrap: anywhere; }
      .command { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; text-align: left; }
      .command:hover { border-color: var(--accent); }
      .command.danger { color: var(--danger); }
      .command:disabled { opacity: 0.45; cursor: not-allowed; }
      .actions { display: grid; gap: 7px; padding: 10px 12px; }

      @media (max-width: 1080px) {
        .workspace { grid-template-columns: 220px minmax(0, 1fr); }
        .inspector { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .inspector .panel-header, .inspector .memory-list, .inspector .actions { grid-column: 1 / -1; }
      }
      @media (max-width: 760px) {
        .shell { width: min(calc(100vw - 12px), 760px); padding: 6px 0; }
        .workspace { grid-template-columns: 1fr; }
        .sessions { max-height: none; }
        .session-list { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
        .session-item { flex: 0 0 min(240px, calc(100vw - 48px)); margin: 0; }
        .conversation { min-height: 560px; }
        .messages { padding: 12px; }
        .message { max-width: 94%; }
        .inspector { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .topbar { align-items: flex-start; }
        .health { margin-top: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark">AI</div>
          <div>
            <h1>AI 应用基础平台</h1>
            <div class="subtitle" id="endpoint">连接模型网关中</div>
          </div>
        </div>
        <div class="health"><span class="dot" id="statusDot"></span><span id="statusText">检查中</span></div>
      </header>

      <section class="workspace">
        <aside class="panel sessions">
          <div class="panel-header">
            <div class="panel-title">会话</div>
            <button class="icon-button" id="newConversation" type="button" aria-label="新建会话" title="新建会话">+</button>
          </div>
          <div class="session-list" id="sessionList"></div>
          <div class="session-footer" id="sessionCount">0 个会话</div>
        </aside>

        <section class="panel conversation">
          <div class="panel-header">
            <div class="panel-title" id="conversationTitle">选择会话</div>
            <div class="conversation-status" id="conversationStatus">-</div>
          </div>
          <div class="messages" id="messages"><div class="empty-state">正在加载会话</div></div>
          <form class="composer" id="form">
            <div class="composer-box">
              <div class="attachments" id="attachments" hidden></div>
              <div class="link-adder" id="linkAdder" hidden>
                <input class="link-input" id="linkInput" type="url" placeholder="https://example.com" autocomplete="off" />
                <button class="link-action" id="confirmLink" type="button" aria-label="添加链接">+</button>
                <button class="link-action" id="cancelLink" type="button" aria-label="取消">×</button>
              </div>
              <textarea class="message-input" id="messageInput" rows="2" placeholder="输入消息" autocomplete="off"></textarea>
              <div class="composer-toolbar">
                <div class="toolbar-left">
                  <button class="icon-button" id="openAddMenu" type="button" aria-label="添加附件" title="添加附件">+</button>
                  <div class="add-menu" id="addMenu" hidden>
                    <button class="menu-item" id="chooseImage" type="button">上传图片</button>
                    <button class="menu-item" type="button" data-link-type="image">图片链接</button>
                    <button class="menu-item" type="button" data-link-type="document">文档链接</button>
                  </div>
                  <span class="attachment-note" id="attachmentNote">无附件</span>
                </div>
                <button class="send-button" id="send" type="submit" aria-label="发送" title="发送">↑</button>
                <input class="file-input" id="imageFileInput" type="file" accept="image/*" multiple />
              </div>
            </div>
          </form>
        </section>

        <aside class="panel inspector">
          <div class="panel-header"><div class="panel-title">运行上下文</div></div>
          <div class="metric"><div class="metric-label">模型</div><div class="metric-value" id="model">chat-default</div></div>
          <div class="metric"><div class="metric-label">最近耗时</div><div class="metric-value" id="latency">-</div></div>
          <div class="metric"><div class="metric-label">会话版本</div><div class="metric-value" id="conversationVersion">-</div></div>
          <div class="metric"><div class="metric-label">记忆版本</div><div class="metric-value" id="memoryVersion">-</div></div>
          <div class="metric"><div class="metric-label">压缩水位</div><div class="metric-value" id="memoryWatermark">-</div></div>
          <div class="metric"><div class="metric-label">本轮 token</div><div class="metric-value" id="contextTokens">-</div></div>
          <div class="memory-list" id="memoryList"></div>
          <div class="actions">
            <button class="command" type="button" data-prompt="总结当前目标、已完成事项和下一步。">总结当前状态</button>
            <button class="command" type="button" data-prompt="列出当前仍然有效的关键约束和已做决定。">检查有效记忆</button>
            <button class="command danger" id="closeConversation" type="button">结束会话</button>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const elements = {
        endpoint: document.querySelector("#endpoint"),
        statusDot: document.querySelector("#statusDot"),
        statusText: document.querySelector("#statusText"),
        sessionList: document.querySelector("#sessionList"),
        sessionCount: document.querySelector("#sessionCount"),
        newConversation: document.querySelector("#newConversation"),
        conversationTitle: document.querySelector("#conversationTitle"),
        conversationStatus: document.querySelector("#conversationStatus"),
        messages: document.querySelector("#messages"),
        form: document.querySelector("#form"),
        messageInput: document.querySelector("#messageInput"),
        send: document.querySelector("#send"),
        model: document.querySelector("#model"),
        latency: document.querySelector("#latency"),
        conversationVersion: document.querySelector("#conversationVersion"),
        memoryVersion: document.querySelector("#memoryVersion"),
        memoryWatermark: document.querySelector("#memoryWatermark"),
        contextTokens: document.querySelector("#contextTokens"),
        memoryList: document.querySelector("#memoryList"),
        closeConversation: document.querySelector("#closeConversation"),
        openAddMenu: document.querySelector("#openAddMenu"),
        addMenu: document.querySelector("#addMenu"),
        chooseImage: document.querySelector("#chooseImage"),
        imageFileInput: document.querySelector("#imageFileInput"),
        attachments: document.querySelector("#attachments"),
        attachmentNote: document.querySelector("#attachmentNote"),
        linkAdder: document.querySelector("#linkAdder"),
        linkInput: document.querySelector("#linkInput"),
        confirmLink: document.querySelector("#confirmLink"),
        cancelLink: document.querySelector("#cancelLink"),
      };

      let conversations = [];
      let currentConversation = null;
      let currentConversationId = "";
      let currentContext = null;
      let eventSource = null;
      let refreshTimer = null;
      let activeLinkType = "image";
      let attachedImages = [];
      let attachedDocuments = [];
      let sending = false;

      /** 初始化网关状态、会话列表和周期性多端补偿刷新。 */
      async function initialize() {
        bindEvents();
        await loadGatewayStatus();
        await refreshConversationList(true);
        setInterval(refreshConversationList, 5000);
      }

      /** 绑定页面所有静态交互。 */
      function bindEvents() {
        elements.newConversation.addEventListener("click", createConversation);
        elements.form.addEventListener("submit", handleSubmit);
        elements.closeConversation.addEventListener("click", closeCurrentConversation);
        elements.openAddMenu.addEventListener("click", toggleAddMenu);
        elements.chooseImage.addEventListener("click", openImagePicker);
        elements.imageFileInput.addEventListener("change", handleImageSelection);
        elements.confirmLink.addEventListener("click", confirmAttachmentLink);
        elements.cancelLink.addEventListener("click", closeLinkAdder);
        elements.messageInput.addEventListener("input", resizeInput);
        for (const button of document.querySelectorAll("[data-link-type]")) button.addEventListener("click", openLinkAdder);
        for (const button of document.querySelectorAll("[data-prompt]")) button.addEventListener("click", applyPrompt);
      }

      /** 查询模型网关健康状态。 */
      async function loadGatewayStatus() {
        try {
          const data = await requestJson("/api/gateway/status");
          elements.endpoint.textContent = data.gatewayBaseUrl;
          elements.model.textContent = data.model;
          setHealth(data.ok, data.ok ? "已连接" : "未连接");
        } catch (error) {
          setHealth(false, error.message);
        }
      }

      /** 同步更新网关状态指示。 */
      function setHealth(ok, text) {
        elements.statusDot.className = `dot ${ok ? "ok" : "bad"}`;
        elements.statusText.textContent = text;
      }

      /** 刷新会话列表；首次加载时自动创建或选择一个会话。 */
      async function refreshConversationList(selectInitial = false) {
        const data = await requestJson("/api/runtime/conversations");
        conversations = data.conversations || [];
        renderConversationList();
        if (selectInitial && !currentConversationId) {
          if (conversations.length === 0) await createConversation();
          else await selectConversation(conversations[0].id);
        }
      }

      /** 绘制会话列表和当前选中态。 */
      function renderConversationList() {
        elements.sessionList.textContent = "";
        for (const conversation of conversations) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `session-item ${conversation.id === currentConversationId ? "active" : ""}`;
          button.dataset.conversationId = conversation.id;
          const title = document.createElement("span");
          title.className = "session-title";
          title.textContent = conversation.title;
          const meta = document.createElement("span");
          meta.className = "session-meta";
          meta.innerHTML = `<span>${conversation.status === "active" ? "进行中" : "已结束"}</span><span>${conversation.messageCount} 条</span>`;
          button.append(title, meta);
          button.addEventListener("click", handleSessionSelection);
          elements.sessionList.appendChild(button);
        }
        elements.sessionCount.textContent = `${conversations.length} 个会话`;
      }

      /** 从会话按钮 dataset 读取 ID 并切换会话。 */
      async function handleSessionSelection(event) {
        await selectConversation(event.currentTarget.dataset.conversationId);
      }

      /** 创建新会话并立即切换。 */
      async function createConversation() {
        const conversation = await requestJson("/api/runtime/conversations", { method: "POST", body: {} });
        await refreshConversationList();
        await selectConversation(conversation.id);
        elements.messageInput.focus();
      }

      /** 加载选中会话、重建 SSE 订阅并刷新主视图。 */
      async function selectConversation(conversationId) {
        currentConversationId = conversationId;
        currentContext = null;
        await loadCurrentConversation();
        subscribeCurrentConversation();
        renderConversationList();
      }

      /** 从 Runtime 获取当前会话完整事实状态。 */
      async function loadCurrentConversation() {
        if (!currentConversationId) return;
        currentConversation = await requestJson(`/api/runtime/conversations/${encodeURIComponent(currentConversationId)}`);
        renderCurrentConversation();
      }

      /** 绘制消息、状态、结构化记忆和 Context Manifest。 */
      function renderCurrentConversation() {
        if (!currentConversation) return;
        elements.conversationTitle.textContent = currentConversation.title;
        elements.conversationStatus.textContent = currentConversation.status === "active" ? "进行中" : "已结束";
        elements.messages.textContent = "";
        if (currentConversation.messages.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "开始一段新对话";
          elements.messages.appendChild(empty);
        } else {
          for (const message of currentConversation.messages) addMessage(message.role, message.displayContent);
        }
        elements.conversationVersion.textContent = `v${currentConversation.version} · seq ${currentConversation.lastSeq}`;
        elements.memoryVersion.textContent = `v${currentConversation.memory.version}`;
        elements.memoryWatermark.textContent = `已处理至 seq ${currentConversation.memory.summarizedThroughSeq}`;
        const manifest = currentContext || currentConversation.lastRun?.contextManifest;
        elements.contextTokens.textContent = manifest
          ? `${manifest.countedTokens} / ${manifest.budget}`
          : "等待下一次 Run";
        elements.closeConversation.disabled = currentConversation.status !== "active";
        elements.messageInput.disabled = currentConversation.status !== "active";
        elements.send.disabled = currentConversation.status !== "active" || sending;
        renderMemoryItems();
        elements.messages.scrollTop = elements.messages.scrollHeight;
      }

      /** 显示当前 active 结构化记忆，隐藏 superseded 历史版本。 */
      function renderMemoryItems() {
        elements.memoryList.textContent = "";
        const activeItems = currentConversation.memory.items.filter(isActiveMemory);
        if (activeItems.length === 0) {
          const empty = document.createElement("div");
          empty.className = "metric-label";
          empty.textContent = "暂无结构化记忆";
          elements.memoryList.appendChild(empty);
          return;
        }
        for (const item of activeItems.slice(0, 10)) {
          const row = document.createElement("div");
          row.className = "memory-item";
          const key = document.createElement("div");
          key.className = "memory-key";
          key.textContent = `${item.type} · ${item.entity}.${item.key}`;
          const value = document.createElement("div");
          value.className = "memory-value";
          value.textContent = typeof item.value === "string" ? item.value : JSON.stringify(item.value);
          row.append(key, value);
          elements.memoryList.appendChild(row);
        }
      }

      /** 判断记忆项是否为当前有效版本。 */
      function isActiveMemory(item) {
        return item.status === "active";
      }

      /** 订阅当前会话 SQLite 事件游标，并在其他端更新后刷新。 */
      function subscribeCurrentConversation() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/runtime/conversations/${encodeURIComponent(currentConversationId)}/events`);
        eventSource.onmessage = scheduleRemoteRefresh;
      }

      /** 合并短时间内的多个 SSE 事件，避免重复请求详情。 */
      function scheduleRemoteRefresh() {
        if (sending) return;
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(refreshFromRemoteEvent, 120);
      }

      /** SSE 事件到达后同步当前会话和列表。 */
      async function refreshFromRemoteEvent() {
        if (sending) return;
        await Promise.all([loadCurrentConversation(), refreshConversationList()]);
      }

      /** 创建并追加一条安全文本消息。 */
      function addMessage(role, text, extraClass = "") {
        const node = document.createElement("div");
        node.className = `message ${role} ${extraClass}`.trim();
        node.textContent = text;
        elements.messages.appendChild(node);
        elements.messages.scrollTop = elements.messages.scrollHeight;
        return node;
      }

      /** 处理表单发送并阻止空输入。 */
      async function handleSubmit(event) {
        event.preventDefault();
        const payload = buildRunPayload();
        if (!payload.message && payload.imageUrls.length === 0 && payload.documentUrls.length === 0) return;
        await runConversation(payload);
      }

      /** 构造只包含当前输入和幂等标识的 Run 请求。 */
      function buildRunPayload() {
        return {
          requestId: crypto.randomUUID(),
          clientMessageId: crypto.randomUUID(),
          message: elements.messageInput.value.trim(),
          imageUrls: attachedImages.map(getAttachmentUrl),
          documentUrls: attachedDocuments.map(getAttachmentUrl),
        };
      }

      /** 返回附件 URL，供当前 Run 载荷复用。 */
      function getAttachmentUrl(item) {
        return item.url;
      }

      /** 调用流式 Run API，增量更新助手消息并在完成后以服务端事实状态收口。 */
      async function runConversation(payload) {
        const startedAt = performance.now();
        const runConversationId = currentConversationId;
        const display = formatDisplayInput(payload);
        sending = true;
        elements.messages.querySelector(".empty-state")?.remove();
        addMessage("user", display);
        const pending = addMessage("assistant", "请求中", "pending");
        elements.send.disabled = true;
        resetComposer();
        let receivedText = false;

        /** 把新文本追加到同一个助手消息节点，避免增量之间重建布局。 */
        function renderTextDelta(delta) {
          if (!pending.isConnected || currentConversationId !== runConversationId) return;
          if (!receivedText) {
            receivedText = true;
            pending.textContent = "";
            pending.classList.remove("pending");
            pending.classList.add("streaming");
          }
          pending.textContent += delta;
          elements.messages.scrollTop = elements.messages.scrollHeight;
        }

        try {
          const data = await requestRunStream(
            `/api/runtime/conversations/${encodeURIComponent(runConversationId)}/runs/stream`,
            payload,
            { onTextDelta: renderTextDelta },
          );
          elements.latency.textContent = `${Math.round(performance.now() - startedAt)} ms`;
          setHealth(true, data.replayed ? "已重放" : "已连接");
          if (currentConversationId === runConversationId) {
            currentConversation = data.conversation;
            currentContext = data.context;
            renderCurrentConversation();
          }
          await refreshConversationList();
        } catch (error) {
          pending.remove();
          if (currentConversationId === runConversationId) {
            await loadCurrentConversation();
            addMessage("error", error.message);
          }
          setHealth(false, "请求失败");
        } finally {
          sending = false;
          elements.send.disabled = currentConversation?.status !== "active";
          elements.messageInput.focus();
        }
      }

      /** 将当前输入转换为乐观消息文本。 */
      function formatDisplayInput(payload) {
        const sections = [];
        if (payload.message) sections.push(payload.message);
        if (payload.imageUrls.length > 0) sections.push(`图片：${payload.imageUrls.length} 个`);
        if (payload.documentUrls.length > 0) sections.push(`参考文档链接：\n${payload.documentUrls.join("\n")}`);
        return sections.join("\n\n");
      }

      /** 完成最终 checkpoint 并关闭当前会话。 */
      async function closeCurrentConversation() {
        if (!currentConversationId || !window.confirm("结束当前会话？")) return;
        const data = await requestJson(
          `/api/runtime/conversations/${encodeURIComponent(currentConversationId)}/close`,
          { method: "POST", body: {} },
        );
        currentConversation = await requestJson(`/api/runtime/conversations/${encodeURIComponent(data.conversation.id)}`);
        renderCurrentConversation();
        await refreshConversationList();
      }

      /** 把快捷命令写入输入框。 */
      function applyPrompt(event) {
        elements.messageInput.value = event.currentTarget.dataset.prompt;
        resizeInput();
        elements.messageInput.focus();
      }

      /** 打开或关闭附件菜单。 */
      function toggleAddMenu() {
        elements.addMenu.hidden = !elements.addMenu.hidden;
      }

      /** 打开本地图片选择器。 */
      function openImagePicker() {
        elements.addMenu.hidden = true;
        elements.imageFileInput.click();
      }

      /** 读取选择的本地图片并添加为 data URL。 */
      async function handleImageSelection(event) {
        for (const file of event.target.files) {
          if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024 || attachedImages.length >= 4) continue;
          attachedImages.push({ id: crypto.randomUUID(), name: file.name, url: await readFileAsDataUrl(file) });
        }
        event.target.value = "";
        renderAttachments();
      }

      /** 将本地文件异步读取为 data URL。 */
      function readFileAsDataUrl(file) {
        // FileReader 事件通过一次性 Promise 暴露给附件流程。
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", handleLoad);
          reader.addEventListener("error", reject);
          /** 返回 FileReader 已完成的 data URL。 */
          function handleLoad() { resolve(String(reader.result)); }
          reader.readAsDataURL(file);
        });
      }

      /** 打开图片或文档链接输入行。 */
      function openLinkAdder(event) {
        activeLinkType = event.currentTarget.dataset.linkType;
        elements.addMenu.hidden = true;
        elements.linkAdder.hidden = false;
        elements.linkInput.placeholder = activeLinkType === "image" ? "图片 URL" : "文档 URL";
        elements.linkInput.focus();
      }

      /** 校验并添加当前链接附件。 */
      function confirmAttachmentLink() {
        const url = elements.linkInput.value.trim();
        if (!/^https?:\/\//i.test(url)) return;
        const item = { id: crypto.randomUUID(), name: url, url };
        if (activeLinkType === "image") attachedImages.push(item);
        else attachedDocuments.push(item);
        closeLinkAdder();
        renderAttachments();
      }

      /** 关闭链接输入行并清空输入。 */
      function closeLinkAdder() {
        elements.linkInput.value = "";
        elements.linkAdder.hidden = true;
      }

      /** 绘制当前图片和文档附件。 */
      function renderAttachments() {
        elements.attachments.textContent = "";
        const items = [
          ...attachedImages.map(markImageAttachment),
          ...attachedDocuments.map(markDocumentAttachment),
        ];
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "attachment";
          const name = document.createElement("span");
          name.className = "attachment-name";
          name.textContent = `${item.type === "image" ? "图片" : "文档"} · ${item.name}`;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "attachment-remove";
          remove.textContent = "×";
          remove.dataset.attachmentId = item.id;
          remove.dataset.attachmentType = item.type;
          remove.addEventListener("click", removeAttachment);
          row.append(name, remove);
          elements.attachments.appendChild(row);
        }
        elements.attachments.hidden = items.length === 0;
        elements.attachmentNote.textContent = items.length === 0 ? "无附件" : `${items.length} 个附件`;
      }

      /** 给图片附件补充展示类型。 */
      function markImageAttachment(item) { return { ...item, type: "image" }; }

      /** 给文档附件补充展示类型。 */
      function markDocumentAttachment(item) { return { ...item, type: "document" }; }

      /** 从对应集合移除附件。 */
      function removeAttachment(event) {
        const { attachmentId, attachmentType } = event.currentTarget.dataset;
        /** 保留当前移除目标之外的附件。 */
        function keepAttachment(item) { return item.id !== attachmentId; }
        if (attachmentType === "image") attachedImages = attachedImages.filter(keepAttachment);
        else attachedDocuments = attachedDocuments.filter(keepAttachment);
        renderAttachments();
      }

      /** 清空已发送输入和附件。 */
      function resetComposer() {
        elements.messageInput.value = "";
        attachedImages = [];
        attachedDocuments = [];
        closeLinkAdder();
        elements.addMenu.hidden = true;
        renderAttachments();
        resizeInput();
      }

      /** 根据内容自适应输入框高度并限制最大值。 */
      function resizeInput() {
        elements.messageInput.style.height = "auto";
        elements.messageInput.style.height = `${Math.min(elements.messageInput.scrollHeight, 160)}px`;
      }

      /** 执行 POST SSE Run，并返回 completed 事件中的最终持久化结果。 */
      async function requestRunStream(path, body, handlers = {}) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Accept": "text/event-stream", "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw new Error(await readResponseError(response));
        if (!response.body) throw new Error("浏览器未提供流式响应体");
        let completed = null;

        /** 分发模型文本、完成和错误事件。 */
        async function handleRunEvent(event) {
          if (event.name === "text-delta") {
            await handlers.onTextDelta?.(String(event.data.delta || ""));
            return;
          }
          if (event.name === "completed") {
            completed = event.data;
            return;
          }
          if (event.name === "error") throw new Error(event.data.error || "流式请求失败");
        }

        await readJsonEventStream(response.body, handleRunEvent);
        if (!completed) throw new Error("流式请求未返回最终结果");
        return completed;
      }

      /** 按 SSE 空行边界读取任意分块的 UTF-8 响应。 */
      async function readJsonEventStream(stream, handleEvent) {
        const reader = stream.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        try {
          while (true) {
            const result = await reader.read();
            if (result.done) break;
            buffer += decoder.decode(result.value, { stream: true });
            let boundary = /\r?\n\r?\n/.exec(buffer);
            while (boundary) {
              const block = buffer.slice(0, boundary.index);
              buffer = buffer.slice(boundary.index + boundary[0].length);
              await dispatchJsonEvent(block, handleEvent);
              boundary = /\r?\n\r?\n/.exec(buffer);
            }
          }
          buffer += decoder.decode();
          if (buffer.trim()) await dispatchJsonEvent(buffer, handleEvent);
        } finally {
          reader.releaseLock();
        }
      }

      /** 解析单个 SSE block，并把 JSON data 交给调用方。 */
      async function dispatchJsonEvent(block, handleEvent) {
        let name = "message";
        const dataLines = [];
        for (const line of block.split(/\r?\n/)) {
          if (line.startsWith("event:")) name = line.slice(6).trim();
          if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
        }
        if (dataLines.length === 0) return;
        await handleEvent({ name, data: JSON.parse(dataLines.join("\n")) });
      }

      /** 从非 SSE 错误响应中读取公开错误消息。 */
      async function readResponseError(response) {
        try {
          const data = await response.json();
          return data.error || `HTTP ${response.status}`;
        } catch {
          return `HTTP ${response.status}`;
        }
      }

      /** 执行 JSON API 请求并把错误载荷转换为 Error。 */
      async function requestJson(path, options = {}) {
        const response = await fetch(path, {
          method: options.method || "GET",
          headers: options.body ? { "Content-Type": "application/json" } : undefined,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }

      initialize().catch(handleInitializationError);

      /** 将初始化失败显示在连接状态和消息区。 */
      function handleInitializationError(error) {
        setHealth(false, "初始化失败");
        elements.messages.textContent = "";
        addMessage("error", error.message);
      }
    </script>
  </body>
</html>
